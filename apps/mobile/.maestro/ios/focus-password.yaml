appId: com.beflow.petflow
name: PetFlow iOS capture password focus
---
- scrollUntilVisible:
    element:
      id: "^auth-password-input$"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "^auth-password-input$"
      focused: true
    timeout: 10000
