appId: com.beflow.petflow
name: PetFlow iOS capture password focus
---
- scrollUntilVisible:
    element:
      text: "비밀번호 재설정 메일 받기"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "^로그인$"
    enabled: true
    below: "이메일과 비밀번호"
    above: "비밀번호 재설정 메일 받기"
- extendedWaitUntil:
    visible: "비밀번호를 입력해 주세요."
    timeout: 10000
- assertNotVisible: "이메일 형식을 확인해 주세요."
- scrollUntilVisible:
    element:
      text: "^비밀번호$"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "^비밀번호$"
    index: 1
