appId: com.beflow.petflow
name: PetFlow iOS capture password paste verification cleanup
---
- eraseText
- extendedWaitUntil:
    visible:
      text: "^비밀번호$"
      index: 1
    timeout: 10000
- tapOn:
    text: "^비밀번호$"
    index: 1
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      text: "^비밀번호$"
      index: 1
      focused: true
    timeout: 10000
