appId: com.beflow.petflow
name: Verify protected QA login
---
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "비밀번호 재설정 메일 받기"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "^로그인$"
    enabled: true
    below: "이메일과 비밀번호"
    above: "비밀번호 재설정 메일 받기"
- extendedWaitUntil:
    visible: "^홈$"
    timeout: 30000
- assertNotVisible: "이메일로 로그인"
