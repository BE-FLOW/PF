appId: com.beflow.petflow
name: PetFlow iOS capture email paste verification
---
- runFlow:
    when:
      visible: "^Allow Paste$"
    commands:
      - tapOn: "^Allow Paste$"
- runFlow:
    when:
      visible: "^붙여넣기 허용$"
    commands:
      - tapOn: "^붙여넣기 허용$"
- extendedWaitUntil:
    visible: "^petflow@@paste-check$"
    timeout: 15000
- tapOn: "^petflow@@paste-check$"
- eraseText
- extendedWaitUntil:
    visible: "^name@example[.]com$"
    timeout: 10000
- tapOn:
    text: "^name@example[.]com$"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      text: "^name@example[.]com$"
      focused: true
    timeout: 10000
