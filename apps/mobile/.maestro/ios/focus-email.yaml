appId: com.beflow.petflow
name: PetFlow iOS capture email focus
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "^이메일로 로그인$"
      enabled: true
    timeout: 30000
- tapOn:
    text: "^이메일로 로그인$"
    enabled: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "^name@example[.]com$"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "^name@example[.]com$"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      text: "^name@example[.]com$"
      focused: true
    timeout: 10000
