appId: com.beflow.petflow
name: PetFlow iOS capture email system paste
---
- tapOn: "^name@example.com$"
- waitForAnimationToEnd
- longPressOn: "^name@example.com$"
- extendedWaitUntil:
    visible: "^(Paste|붙여넣기)$"
    timeout: 15000
- tapOn: "^(Paste|붙여넣기)$"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Allow Paste$"
    commands:
      - tapOn: "^Allow Paste$"
- runFlow:
    when:
      visible: "^붙여넣기 허용$"
    commands:
      - tapOn: "^붙여넣기 허용$"
- waitForAnimationToEnd
