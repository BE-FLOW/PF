appId: com.beflow.petflow
name: PetFlow iOS capture password system paste
---
- longPressOn:
    text: "^비밀번호$"
    index: 1
- extendedWaitUntil:
    visible: "^(Paste|붙여넣기)$"
    timeout: 15000
- tapOn: "^(Paste|붙여넣기)$"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "^Allow Paste$"
    commands:
      - tapOn: "^Allow Paste$"
- runFlow:
    when:
      visible: "^붙여넣기 허용$"
    commands:
      - tapOn: "^붙여넣기 허용$"
- waitForAnimationToEnd
