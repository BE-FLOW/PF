name: PetFlow iOS build 32 simulator capture

on:
  push:
    branches:
      - codex/ios-capture-build32

permissions:
  contents: read

concurrency:
  group: petflow-ios-capture-build32
  cancel-in-progress: false

env:
  RUNTIME_BASE_COMMIT: 65fe4d081769f35e876353e597c26f0a63cf6efe
  CAPTURE_BRANCH: codex/ios-capture-build32
  CAPTURE_RUNTIME_PATCH_SHA256: 7dabbc4642735e33512826f8918db344e3b35a2d51b0cd364a3697689ad52797
  EAS_BUILD_PROFILE: ios-store-screenshot-ci
  PRODUCTION_EAS_BUILD_ID: 174779e0-899c-4f04-b31a-b886c6deba61
  PRODUCTION_BUILD_NUMBER: "32"
  IOS_APP_VERSION: "1.0"
  IOS_BUNDLE_ID: com.beflow.petflow
  IOS_DEVICE_NAME: iPhone 16 Plus
  IOS_RUNTIME_NAME: iOS 18.5
  MAESTRO_VERSION: 2.7.0
  MAESTRO_ZIP_SHA256: a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_DISABLE_UPDATE_CHECK: "true"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
  SIM_USE_VERSION: 0.13.0
  SIM_USE_ARCHIVE_SHA256: f3da237663199faf4c7f6796c3ede6ce7583da872dc27d92eb3b7eb051725081
  SIM_USE_NO_DAEMON: "1"
  SIM_USE_HID_STABILIZATION_MS: "1000"

jobs:
  capture:
    name: Capture actual iOS Simulator screens
    runs-on: macos-15
    timeout-minutes: 35
    environment: petflow-ios-capture
    env:
      EAS_SIMULATOR_ARTIFACT_SHA256: ${{ vars.EAS_SIMULATOR_ARTIFACT_SHA256 }}
      EAS_SIMULATOR_BINARY_BUILD_NUMBER: ${{ vars.EAS_SIMULATOR_BINARY_BUILD_NUMBER }}
      EAS_SIMULATOR_BUILD_ID: ${{ vars.EAS_SIMULATOR_BUILD_ID }}
      EAS_SIMULATOR_BUILD_NUMBER: ${{ vars.EAS_SIMULATOR_BUILD_NUMBER }}
      EAS_SIMULATOR_BUILD_COMMIT: ${{ vars.EAS_SIMULATOR_BUILD_COMMIT }}
      EAS_SIMULATOR_BUILD_PROFILE: ${{ vars.EAS_SIMULATOR_BUILD_PROFILE }}
      EAS_SIMULATOR_BUILD_DISTRIBUTION: ${{ vars.EAS_SIMULATOR_BUILD_DISTRIBUTION }}
      EAS_SIMULATOR_IS_SIMULATOR: ${{ vars.EAS_SIMULATOR_IS_SIMULATOR }}

    steps:
      - name: Check out the capture commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify the temporary branch has no runtime changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$CAPTURE_BRANCH" ]]; then
            echo "Unexpected capture ref." >&2
            exit 1
          fi

          merge_base="$(git merge-base "$RUNTIME_BASE_COMMIT" "$GITHUB_SHA")"
          if [[ "$merge_base" != "$RUNTIME_BASE_COMMIT" ]]; then
            echo "The capture branch is not based on the approved runtime commit." >&2
            exit 1
          fi

          actual_paths="$(git diff --name-only "$RUNTIME_BASE_COMMIT..$GITHUB_SHA" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/ios-capture-build32.yml' \
            'apps/mobile/App.tsx' \
            'apps/mobile/.maestro/ios/focus-email.yaml' \
            'apps/mobile/.maestro/ios/verify-email-paste.yaml' \
            'apps/mobile/.maestro/ios/focus-password.yaml' \
            'apps/mobile/.maestro/ios/approve-password-paste.yaml' \
            'apps/mobile/.maestro/ios/verify-password-paste.yaml' \
            'apps/mobile/.maestro/ios/store-capture.yaml' \
            'apps/mobile/eas.json' | LC_ALL=C sort)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo "The temporary branch contains files outside the capture-only allowlist." >&2
            printf '%s\n' "$actual_paths" >&2
            exit 1
          fi

          git diff --quiet "$RUNTIME_BASE_COMMIT" "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/ios-capture-build32.yml' \
            ':(exclude)apps/mobile/App.tsx' \
            ':(exclude)apps/mobile/.maestro/ios/focus-email.yaml' \
            ':(exclude)apps/mobile/.maestro/ios/verify-email-paste.yaml' \
            ':(exclude)apps/mobile/.maestro/ios/focus-password.yaml' \
            ':(exclude)apps/mobile/.maestro/ios/approve-password-paste.yaml' \
            ':(exclude)apps/mobile/.maestro/ios/verify-password-paste.yaml' \
            ':(exclude)apps/mobile/.maestro/ios/store-capture.yaml' \
            ':(exclude)apps/mobile/eas.json'

          node <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");

          const diff = execFileSync(
            "git",
            [
              "diff",
              "--no-ext-diff",
              `${process.env.RUNTIME_BASE_COMMIT}..${process.env.GITHUB_SHA}`,
              "--",
              "apps/mobile/App.tsx",
            ],
          );
          const digest = crypto.createHash("sha256").update(diff).digest("hex");
          assert.equal(digest, process.env.CAPTURE_RUNTIME_PATCH_SHA256);
          NODE

      - name: Verify the additive EAS profile and supplied build metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const baseSha = process.env.RUNTIME_BASE_COMMIT;
          const base = JSON.parse(
            execFileSync(
              "git",
              ["show", baseSha + ":apps/mobile/eas.json"],
              { encoding: "utf8" },
            ),
          );
          const current = JSON.parse(
            fs.readFileSync("apps/mobile/eas.json", "utf8"),
          );
          const profileName = process.env.EAS_BUILD_PROFILE;
          const profile = current.build?.[profileName];

          assert.deepEqual(profile, {
            extends: "production",
            environment: "production",
            autoIncrement: true,
            withoutCredentials: true,
            env: {
              EXPO_PUBLIC_IOS_CAPTURE_AUTOMATION: "true",
            },
            ios: {
              simulator: true,
              buildConfiguration: "Release",
            },
          });
          const withoutCaptureProfile = structuredClone(current);
          delete withoutCaptureProfile.build[profileName];
          assert.deepEqual(withoutCaptureProfile, base);
          NODE

          required_vars=(
            EAS_SIMULATOR_ARTIFACT_SHA256
            EAS_SIMULATOR_BINARY_BUILD_NUMBER
            EAS_SIMULATOR_BUILD_ID
            EAS_SIMULATOR_BUILD_NUMBER
            EAS_SIMULATOR_BUILD_COMMIT
            EAS_SIMULATOR_BUILD_PROFILE
            EAS_SIMULATOR_BUILD_DISTRIBUTION
            EAS_SIMULATOR_IS_SIMULATOR
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Protected environment variable $name is missing." >&2
              exit 1
            fi
          done

          normalized_sha="$(printf '%s' "$EAS_SIMULATOR_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$normalized_sha" =~ ^[a-f0-9]{64}$ ]]; then
            echo "The supplied artifact SHA-256 is invalid." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "The supplied EAS build ID is invalid." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BINARY_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "The supplied Simulator binary build number is invalid." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_COMMIT" =~ ^[a-f0-9]{40}$ ]] ||
             ! git merge-base --is-ancestor "$EAS_SIMULATOR_BUILD_COMMIT" "$GITHUB_SHA"; then
            echo "The Simulator build commit is not an ancestor of the capture commit." >&2
            exit 1
          fi
          post_build_changes="$(
            git diff --name-only "$EAS_SIMULATOR_BUILD_COMMIT..$GITHUB_SHA" |
              while IFS= read -r changed_path; do
                if [[ "$changed_path" != ".github/workflows/ios-capture-build32.yml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/focus-email.yaml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/verify-email-paste.yaml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/focus-password.yaml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/approve-password-paste.yaml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/verify-password-paste.yaml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/store-capture.yaml" ]]; then
                  printf '%s\n' "$changed_path"
                fi
              done
          )"
          if [[ -n "$post_build_changes" ]]; then
            echo "Files outside the capture harness changed after the Simulator build." >&2
            printf '%s\n' "$post_build_changes" >&2
            exit 1
          fi
          if [[ "$EAS_SIMULATOR_BUILD_PROFILE" != "$EAS_BUILD_PROFILE" ]]; then
            echo "The Simulator build profile is unexpected." >&2
            exit 1
          fi
          normalized_distribution="$(printf '%s' "$EAS_SIMULATOR_BUILD_DISTRIBUTION" | tr '[:lower:]' '[:upper:]')"
          normalized_simulator="$(printf '%s' "$EAS_SIMULATOR_IS_SIMULATOR" | tr '[:upper:]' '[:lower:]')"
          if [[ "$normalized_distribution" != "STORE" ]] ||
             [[ "$normalized_simulator" != "true" ]]; then
            echo "The supplied EAS build metadata is not a Store-profile iOS Simulator build." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_NUMBER" =~ ^[0-9]+$ ]] ||
             (( EAS_SIMULATOR_BUILD_NUMBER <= PRODUCTION_BUILD_NUMBER )); then
            echo "The Simulator build number must be distinct from production build 32." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java for Maestro
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Select the pinned Xcode runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Download and verify the EAS Simulator artifact
        shell: bash
        env:
          EAS_SIMULATOR_ARTIFACT_URL: ${{ secrets.EAS_SIMULATOR_ARTIFACT_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${EAS_SIMULATOR_ARTIFACT_URL:-}" ]] ||
             [[ "$EAS_SIMULATOR_ARTIFACT_URL" != https://* ]]; then
            echo "A protected HTTPS EAS artifact URL is required." >&2
            exit 1
          fi

          archive="$RUNNER_TEMP/petflow-ios-simulator-artifact"
          extract_dir="$RUNNER_TEMP/petflow-ios-simulator-app"
          mkdir -p "$extract_dir"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "$EAS_SIMULATOR_ARTIFACT_URL" \
            --output "$archive"

          expected_sha="$(printf '%s' "$EAS_SIMULATOR_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "The EAS artifact SHA-256 does not match the protected value." >&2
            exit 1
          fi

          if unzip -tqq "$archive" >/dev/null 2>&1; then
            ditto -x -k "$archive" "$extract_dir"
          elif tar -tf "$archive" >/dev/null 2>&1; then
            tar -xf "$archive" -C "$extract_dir"
          else
            echo "The verified EAS artifact is not a supported archive." >&2
            exit 1
          fi

          app_paths="$RUNNER_TEMP/petflow-ios-app-paths.txt"
          find "$extract_dir" -type d -name '*.app' -prune -print > "$app_paths"
          app_count="$(wc -l < "$app_paths" | tr -d '[:space:]')"
          if [[ "$app_count" != "1" ]]; then
            echo "Expected exactly one iOS Simulator .app bundle." >&2
            exit 1
          fi
          app_path="$(head -n 1 "$app_paths")"
          info_plist="$app_path/Info.plist"
          if [[ ! -f "$info_plist" ]]; then
            echo "The Simulator app has no Info.plist." >&2
            exit 1
          fi

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          if [[ "$bundle_id" != "$IOS_BUNDLE_ID" ]] ||
             [[ "$app_version" != "$IOS_APP_VERSION" ]] ||
             [[ "$build_number" != "$EAS_SIMULATOR_BINARY_BUILD_NUMBER" ]]; then
            echo "The Simulator app identity does not match the protected metadata." >&2
            exit 1
          fi
          architectures="$(lipo -archs "$app_path/$executable_name")"
          if [[ " $architectures " != *" arm64 "* ]]; then
            echo "The Simulator app cannot run on the arm64 macOS runner." >&2
            exit 1
          fi

          {
            echo "APP_PATH<<PETFLOW_APP_PATH"
            echo "$app_path"
            echo "PETFLOW_APP_PATH"
          } >> "$GITHUB_ENV"

      - name: Boot an exact-size iPhone Simulator and install PetFlow
        shell: bash
        run: |
          set -euo pipefail

          runtime_id="$(xcrun simctl list runtimes -j | jq -r \
            --arg name "$IOS_RUNTIME_NAME" \
            '.runtimes[] | select(.name == $name and .isAvailable == true) | .identifier' |
            head -n 1)"
          device_type_id="$(xcrun simctl list devicetypes -j | jq -r \
            --arg name "$IOS_DEVICE_NAME" \
            '.devicetypes[] | select(.name == $name) | .identifier' |
            head -n 1)"
          if [[ -z "$runtime_id" ]] || [[ -z "$device_type_id" ]]; then
            echo "The pinned iPhone 16 Plus / iOS 18.5 Simulator is unavailable." >&2
            exit 1
          fi

          simulator_udid="$(xcrun simctl create \
            'PetFlow build 32 capture' "$device_type_id" "$runtime_id")"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          if [[ "$(defaults read com.apple.iphonesimulator ConnectHardwareKeyboard)" != "1" ]]; then
            echo "The Simulator hardware keyboard preference was not applied." >&2
            exit 1
          fi
          xcrun simctl boot "$simulator_udid"
          open -a Simulator --args -CurrentDeviceUDID "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl status_bar "$simulator_udid" override \
            --time '9:41' \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl install "$simulator_udid" "$APP_PATH"
          xcrun simctl get_app_container "$simulator_udid" "$IOS_BUNDLE_ID" app >/dev/null

      - name: Install exact mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          maestro_zip="$RUNNER_TEMP/maestro-$MAESTRO_VERSION.zip"
          maestro_dir="$RUNNER_TEMP/maestro-$MAESTRO_VERSION"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip" \
            --output "$maestro_zip"
          actual_maestro_sha="$(shasum -a 256 "$maestro_zip" | awk '{print $1}')"
          if [[ "$actual_maestro_sha" != "$MAESTRO_ZIP_SHA256" ]]; then
            echo "The Maestro archive SHA-256 does not match the pinned release." >&2
            exit 1
          fi
          unzip -q "$maestro_zip" -d "$maestro_dir"
          test -x "$maestro_dir/maestro/bin/maestro"
          echo "MAESTRO_BIN=$maestro_dir/maestro/bin/maestro" >> "$GITHUB_ENV"

      - name: Install pinned Simulator HID CLI
        shell: bash
        run: |
          set -euo pipefail
          sim_use_archive="$RUNNER_TEMP/sim-use-$SIM_USE_VERSION.tar.gz"
          sim_use_dir="$RUNNER_TEMP/sim-use-$SIM_USE_VERSION"
          mkdir -p "$sim_use_dir"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "https://github.com/lycorp-jp/sim-use/releases/download/v$SIM_USE_VERSION/sim-use-v$SIM_USE_VERSION.tar.gz" \
            --output "$sim_use_archive"
          actual_sim_use_sha="$(shasum -a 256 "$sim_use_archive" | awk '{print $1}')"
          if [[ "$actual_sim_use_sha" != "$SIM_USE_ARCHIVE_SHA256" ]]; then
            echo "The sim-use archive SHA-256 does not match the pinned release." >&2
            exit 1
          fi
          tar -xzf "$sim_use_archive" -C "$sim_use_dir"
          sim_use_bin="$sim_use_dir/sim-use"
          test -x "$sim_use_bin"
          codesign --force --sign - --timestamp=none "$sim_use_bin"
          codesign --verify --strict "$sim_use_bin"
          version_output="$("$sim_use_bin" --version)"
          if [[ "$version_output" != *"$SIM_USE_VERSION"* ]]; then
            echo "The sim-use binary version does not match the pinned release." >&2
            exit 1
          fi
          echo "SIM_USE_BIN=$sim_use_bin" >> "$GITHUB_ENV"

      - name: Run the synthetic store-review capture flow
        id: maestro_capture
        shell: bash
        env:
          QA_EMAIL: ${{ secrets.PETFLOW_QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.PETFLOW_QA_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          qa_email="${QA_EMAIL:-}"
          qa_password="${QA_PASSWORD:-}"
          unset QA_EMAIL QA_PASSWORD
          export -n qa_email qa_password
          if [[ -z "$qa_email" ]] || [[ -z "$qa_password" ]]; then
            echo "Protected QA credentials are required." >&2
            exit 1
          fi

          previous_lc_all_state="${LC_ALL+x}"
          previous_lc_all="${LC_ALL-}"
          LC_ALL=C
          email_shape_valid="true"
          if [[ "$qa_email" != "${qa_email# }" ]] ||
             [[ "$qa_email" != "${qa_email% }" ]] ||
             [[ ! "$qa_email" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            email_shape_valid="false"
          fi
          password_shape_valid="true"
          if (( ${#qa_password} < 12 || ${#qa_password} > 64 )) ||
             [[ ! "$qa_password" =~ ^[[:graph:]]+$ ]]; then
            password_shape_valid="false"
          fi
          if [[ "$previous_lc_all_state" == "x" ]]; then
            LC_ALL="$previous_lc_all"
          else
            unset LC_ALL
          fi
          unset previous_lc_all_state previous_lc_all
          if [[ "$email_shape_valid" != "true" ]]; then
            echo "The protected QA email shape is invalid." >&2
            exit 1
          fi
          if [[ "$password_shape_valid" != "true" ]]; then
            echo "The protected QA password shape is invalid." >&2
            exit 1
          fi
          unset email_shape_valid password_shape_valid
          echo "Protected QA credential shape validated."

          capture_debug_dir="$RUNNER_TEMP/maestro-capture-output"
          sensitive_paste_root="$RUNNER_TEMP/petflow-sensitive-paste"
          store_screenshot_export_dir="$capture_debug_dir/store-capture-screenshots"
          STORE_SCREENSHOT_EXPORT_COMPLETE="false"
          mkdir -p "$capture_debug_dir"
          chmod 700 "$capture_debug_dir"
          mkdir -p "$sensitive_paste_root"
          chmod 700 "$sensitive_paste_root"

          sim_use() {
            env \
              -u QA_EMAIL \
              -u QA_PASSWORD \
              -u SIM_USE_DEBUG \
              SIM_USE_NO_DAEMON="$SIM_USE_NO_DAEMON" \
              SIM_USE_HID_STABILIZATION_MS="$SIM_USE_HID_STABILIZATION_MS" \
              "$SIM_USE_BIN" "$@"
          }

          clear_pasteboards() {
            {
              printf '' |
                env \
                  -u QA_EMAIL \
                  -u QA_PASSWORD \
                  -u SIM_USE_DEBUG \
                  xcrun simctl pbcopy "$SIMULATOR_UDID"
            } >/dev/null 2>&1 || true
            env \
              -u QA_EMAIL \
              -u QA_PASSWORD \
              -u SIM_USE_DEBUG \
              /usr/bin/pbcopy </dev/null >/dev/null 2>&1 || true
          }
          strict_clear_pasteboards() {
            set +e
            printf '' |
              env \
                -u QA_EMAIL \
                -u QA_PASSWORD \
                -u SIM_USE_DEBUG \
                xcrun simctl pbcopy "$SIMULATOR_UDID" \
                  >/dev/null 2>&1
            local -a simulator_clear_status=("${PIPESTATUS[@]}")
            env \
              -u QA_EMAIL \
              -u QA_PASSWORD \
              -u SIM_USE_DEBUG \
              /usr/bin/pbcopy </dev/null >/dev/null 2>&1
            local host_clear_status=$?
            set -e
            if (( ${#simulator_clear_status[@]} != 2 )) ||
               (( simulator_clear_status[0] != 0 || simulator_clear_status[1] != 0 )) ||
               (( host_clear_status != 0 )); then
              return 1
            fi
            return 0
          }
          cleanup_capture_secrets() {
            clear_pasteboards
            qa_email=""
            qa_password=""
            unset qa_email qa_password
            if [[ -n "${sensitive_paste_root:-}" ]]; then
              rm -rf -- "$sensitive_paste_root" >/dev/null 2>&1 || true
            fi
            if [[ "${STORE_SCREENSHOT_EXPORT_COMPLETE:-false}" != "true" ]] &&
               [[ -n "${store_screenshot_export_dir:-}" ]]; then
              rm -rf -- "$store_screenshot_export_dir" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_capture_secrets EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          strict_clear_pasteboards
          LAST_PASTE_TARGET_FRAME_X=""
          LAST_PASTE_TARGET_FRAME_Y=""
          LAST_PASTE_TARGET_FRAME_WIDTH=""
          LAST_PASTE_TARGET_FRAME_HEIGHT=""
          LAST_PASTE_TARGET_TYPE=""
          LAST_PASTE_TARGET_ID=""
          LAST_PASTE_TARGET_LABEL_HASH=""
          LAST_PASTE_TARGET_VALUE_HASH=""

          resolve_field_target() {
            local field_role="$1"
            sim_use describe-ui \
              --device "$SIMULATOR_UDID" \
              --max-probes 0 \
              --json \
              2>/dev/null |
              env \
                -u QA_EMAIL \
                -u QA_PASSWORD \
                -u SIM_USE_DEBUG \
                TARGET_FIELD_ROLE="$field_role" \
                node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          function fail(code) {
            fs.writeSync(1, `ERROR_${code}`);
            process.exit(1);
          }

          const document = JSON.parse(fs.readFileSync(0, "utf8"));
          if (document?.ok !== true || !document?.data?.raw) fail("ENVELOPE");
          const raw = document.data.raw;
          const screen = document.data.screen;
          const appPackage = document.data.appPackage;
          const fieldRole = process.env.TARGET_FIELD_ROLE;
          if (typeof appPackage !== "string") fail("ENVELOPE");
          if (appPackage !== "" && appPackage !== "com.beflow.petflow") fail("APP");
          if (!["email", "password"].includes(fieldRole)) fail("ROLE");
          if (
            !screen ||
            ![screen.x, screen.y, screen.width, screen.height].every(Number.isFinite) ||
            screen.width <= 0 ||
            screen.height <= 0
          ) fail("SCREEN");

          function hashValue(value) {
            return crypto
              .createHash("sha256")
              .update(JSON.stringify(value ?? null))
              .digest("hex");
          }

          function inspectRoot(root) {
            const matches = new Map();
            const publicText = [];

            function visit(value) {
              if (Array.isArray(value)) {
                for (const item of value) visit(item);
                return;
              }
              if (!value || typeof value !== "object") return;
              for (const key of ["AXLabel", "AXValue"]) {
                if (typeof value[key] === "string") publicText.push(value[key]);
              }
              const expectedId =
                fieldRole === "email"
                  ? "auth-email-input"
                  : "auth-password-input";
              const isEmail =
                fieldRole === "email" &&
                value.type === "TextField" &&
                value.AXUniqueId === expectedId;
              const isPassword =
                fieldRole === "password" &&
                ["SecureTextField", "TextField"].includes(value.type) &&
                value.AXUniqueId === expectedId;
              if ((isEmail || isPassword) && value.frame) {
                const { x, y, width, height } = value.frame;
                const frame = [x, y, width, height];
                if (
                  frame.every(Number.isFinite) &&
                  x >= 0 &&
                  y >= 0 &&
                  width > 0 &&
                  height > 0 &&
                  x + width / 2 >= screen.x &&
                  x + width / 2 <= screen.x + screen.width &&
                  y + height / 2 >= screen.y &&
                  y + height / 2 <= screen.y + screen.height
                ) {
                  matches.set(frame.join(":"), {
                    frame: value.frame,
                    labelHash: hashValue(value.AXLabel),
                    type: value.type,
                    uniqueId: value.AXUniqueId,
                    valueHash: hashValue(value.AXValue),
                  });
                }
              }
              for (const item of Object.values(value)) visit(item);
            }

            visit(root);
            return { matches, publicText };
          }

          const { matches, publicText } = inspectRoot(raw);
          const hasFallbackScreenSignature =
            fieldRole === "email"
              ? publicText.some((value) => value.includes("이메일과 비밀번호"))
              : publicText.some((value) => value.includes("비밀번호"));
          if (appPackage === "" && !hasFallbackScreenSignature) {
            fail("SCREEN_SIGNATURE");
          }
          if (matches.size !== 1) fail(`FIELD_COUNT_${Math.min(matches.size, 9)}`);
          const [{ frame, labelHash, type, uniqueId, valueHash }] = matches.values();
          const { x, y, width, height } = frame;
          process.stdout.write(
            `${x + width / 2} ${y + height / 2} ${x} ${y} ${width} ${height} ${type} ${uniqueId} ${labelHash} ${valueHash}`,
          );
          ' 2>/dev/null
          }

          verify_target_changed() {
            local field_label="$1"
            local expected_frame_x="$2"
            local expected_frame_y="$3"
            local expected_frame_width="$4"
            local expected_frame_height="$5"
            local expected_type="$6"
            local expected_id="$7"
            local expected_label_hash="$8"
            local expected_value_hash="$9"
            local result
            if ! result="$(
              sim_use describe-ui \
                --device "$SIMULATOR_UDID" \
                --max-probes 0 \
                --json \
                2>/dev/null |
                env \
                  -u QA_EMAIL \
                  -u QA_PASSWORD \
                  -u SIM_USE_DEBUG \
                  EXPECTED_FRAME_X="$expected_frame_x" \
                  EXPECTED_FRAME_Y="$expected_frame_y" \
                  EXPECTED_FRAME_WIDTH="$expected_frame_width" \
                  EXPECTED_FRAME_HEIGHT="$expected_frame_height" \
                  EXPECTED_TARGET_TYPE="$expected_type" \
                  EXPECTED_TARGET_ID="$expected_id" \
                  EXPECTED_LABEL_HASH="$expected_label_hash" \
                  EXPECTED_VALUE_HASH="$expected_value_hash" \
                  node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");

            function fail(code) {
              fs.writeSync(1, `ERROR_${code}`);
              process.exit(1);
            }

            const document = JSON.parse(fs.readFileSync(0, "utf8"));
            if (document?.ok !== true || !document?.data?.raw) fail("ENVELOPE");
            const appPackage = document.data.appPackage;
            const screen = document.data.screen;
            if (typeof appPackage !== "string") fail("ENVELOPE");
            if (appPackage !== "" && appPackage !== "com.beflow.petflow") fail("APP");
            if (
              !screen ||
              ![screen.x, screen.y, screen.width, screen.height].every(Number.isFinite) ||
              screen.width <= 0 ||
              screen.height <= 0
            ) fail("SCREEN");

            const expectedFrame = [
              process.env.EXPECTED_FRAME_X,
              process.env.EXPECTED_FRAME_Y,
              process.env.EXPECTED_FRAME_WIDTH,
              process.env.EXPECTED_FRAME_HEIGHT,
            ].map(Number);
            const expectedType = process.env.EXPECTED_TARGET_TYPE ?? "";
            const expectedId = process.env.EXPECTED_TARGET_ID ?? "";
            const expectedLabelHash = process.env.EXPECTED_LABEL_HASH ?? "";
            const expectedValueHash = process.env.EXPECTED_VALUE_HASH ?? "";
            if (
              !expectedFrame.every(Number.isFinite) ||
              !["SecureTextField", "TextField"].includes(expectedType) ||
              !["auth-email-input", "auth-password-input"].includes(expectedId) ||
              !/^[a-f0-9]{64}$/.test(expectedLabelHash) ||
              !/^[a-f0-9]{64}$/.test(expectedValueHash)
            ) fail("EXPECTED_TARGET");

            function hashValue(value) {
              return crypto
                .createHash("sha256")
                .update(JSON.stringify(value ?? null))
                .digest("hex");
            }

            function inspectRoot(root) {
              const matches = new Map();
              const publicText = [];

              function visit(value) {
                if (Array.isArray(value)) {
                  for (const item of value) visit(item);
                  return;
                }
                if (!value || typeof value !== "object") return;
                for (const key of ["AXLabel", "AXValue"]) {
                  if (typeof value[key] === "string") publicText.push(value[key]);
                }
                if (value.type === expectedType && value.frame) {
                  const { x, y, width, height } = value.frame;
                  const frame = [x, y, width, height];
                  if (
                    frame.every(Number.isFinite) &&
                    width > 0 &&
                    height > 0 &&
                    Math.abs(x - expectedFrame[0]) <= 0.25 &&
                    Math.abs(y - expectedFrame[1]) <= screen.height &&
                    Math.abs(width - expectedFrame[2]) <= 0.25 &&
                    Math.abs(height - expectedFrame[3]) <= 0.25 &&
                    value.AXUniqueId === expectedId &&
                    hashValue(value.AXLabel) === expectedLabelHash
                  ) {
                    matches.set(frame.join(":"), value);
                  }
                }
                for (const item of Object.values(value)) visit(item);
              }

              visit(root);
              return { matches, publicText };
            }

            const raw = document.data.raw;
            const { matches, publicText } = inspectRoot(raw);
            const hasFallbackScreenSignature =
              expectedId === "auth-email-input"
                ? publicText.some((value) => value.includes("이메일과 비밀번호"))
                : publicText.some((value) => value.includes("비밀번호"));
            if (appPackage === "" && !hasFallbackScreenSignature) {
              fail("SCREEN_SIGNATURE");
            }
            if (matches.size !== 1) {
              fail(`FIELD_COUNT_${Math.min(matches.size, 9)}`);
            }
            const [field] = matches.values();
            if (
              typeof field.AXValue !== "string" ||
              field.AXValue.length === 0 ||
              field.AXValue === "비밀번호"
            ) fail("VALUE");
            if (hashValue(field.AXValue) === expectedValueHash) fail("UNCHANGED");
            fs.writeSync(1, "CHANGED");
            ' 2>/dev/null
            )"; then
              if [[ ! "$result" =~ ^ERROR_[A-Z0-9_]+$ ]]; then
                result="ERROR_UNKNOWN"
              fi
              echo "Simulator $field_label value verification failed ($result)." >&2
              return 1
            fi
            if [[ "$result" != "CHANGED" ]]; then
              echo "Simulator $field_label value verification failed (ERROR_UNKNOWN)." >&2
              return 1
            fi
          }

          run_bounded_menu_paste() {
            local target_id="$1"
            local replace_mode="${2:-false}"
            local -a paste_args=(
              "$SIM_USE_BIN" paste --stdin
              --via-menu
              --target-id "$target_id"
              --long-press-duration 0.8
              --menu-timeout 5
              --device "$SIMULATOR_UDID"
              --json
            )
            if [[ "$replace_mode" == "true" ]]; then
              paste_args+=(--replace)
            elif [[ "$replace_mode" != "false" ]]; then
              echo "Simulator menu paste replacement mode is invalid." >&2
              return 1
            fi
            local diagnostic_file="$sensitive_paste_root/menu-paste-$target_id.log"
            : >"$diagnostic_file"
            chmod 600 "$diagnostic_file"
            local paste_status
            set +e
            /usr/bin/perl -e '
              use strict;
              use warnings;
              use POSIX qw(:sys_wait_h);

              my $timeout = shift @ARGV;
              my $child = fork();
              die "fork failed\n" unless defined $child;
              if ($child == 0) {
                setpgrp(0, 0) or die "setpgrp failed\n";
                exec @ARGV;
                exit 126;
              }

              sub terminate_child_group {
                kill "TERM", -$child;
                select undef, undef, undef, 0.5;
                kill "KILL", -$child;
              }

              my $timed_out = 0;
              local $SIG{ALRM} = sub {
                $timed_out = 1;
                terminate_child_group();
              };
              local $SIG{HUP} = sub {
                terminate_child_group();
                waitpid($child, 0);
                exit 129;
              };
              local $SIG{INT} = sub {
                terminate_child_group();
                waitpid($child, 0);
                exit 130;
              };
              local $SIG{TERM} = sub {
                terminate_child_group();
                waitpid($child, 0);
                exit 143;
              };

              alarm $timeout;
              my $waited = waitpid($child, 0);
              my $status = $?;
              alarm 0;
              exit 125 if $waited < 0;
              exit 124 if $timed_out;
              exit WEXITSTATUS($status) if WIFEXITED($status);
              exit 128 + WTERMSIG($status) if WIFSIGNALED($status);
              exit 125;
            ' 15 "${paste_args[@]}" >"$diagnostic_file" 2>&1
            paste_status=$?
            set -e

            local mapped_status="$paste_status"
            if (( paste_status != 0 && paste_status != 124 )); then
              if grep -Fq "Edit menu 'Paste' item did not appear" "$diagnostic_file"; then
                mapped_status=71
              elif grep -Fq "Edit menu 'Select All' item did not appear" "$diagnostic_file"; then
                mapped_status=72
              elif grep -Fq "No accessibility element matched --id" "$diagnostic_file"; then
                mapped_status=73
              elif grep -Fq "simctl pbcopy failed" "$diagnostic_file"; then
                mapped_status=74
              elif grep -Fq "accessibility elements matched --id" "$diagnostic_file"; then
                mapped_status=75
              fi
            fi
            if ! rm -f -- "$diagnostic_file"; then
              return 125
            fi
            return "$mapped_status"
          }

          paste_value() {
            local value="$1"
            export -n value
            local field_label="$2"
            local field_role="$3"
            local replace_mode="${4:-false}"
            local target
            local target_x
            local target_y
            local target_frame_x
            local target_frame_y
            local target_frame_width
            local target_frame_height
            local target_type
            local target_id
            local target_label_hash
            local target_value_hash
            if ! target="$(resolve_field_target "$field_role")"; then
              if [[ ! "$target" =~ ^ERROR_[A-Z0-9_]+$ ]]; then
                target="ERROR_UNKNOWN"
              fi
              echo "Simulator $field_label target resolution failed ($target)." >&2
              return 1
            fi
            read -r \
              target_x \
              target_y \
              target_frame_x \
              target_frame_y \
              target_frame_width \
              target_frame_height \
              target_type \
              target_id \
              target_label_hash \
              target_value_hash \
              <<<"$target"
            if [[ -z "$target_x" ]] ||
               [[ -z "$target_y" ]] ||
               [[ ! "$target_id" =~ ^auth-(email|password)-input$ ]] ||
               [[ ! "$target_label_hash" =~ ^[a-f0-9]{64}$ ]] ||
               [[ ! "$target_value_hash" =~ ^[a-f0-9]{64}$ ]] ||
               [[ ! "$target_type" =~ ^(SecureTextField|TextField)$ ]]; then
              echo "Simulator $field_label target resolution failed." >&2
              return 1
            fi

            if [[ "$field_role" == "email" ]]; then
              if [[ "$target_type" != "TextField" ]] ||
                 [[ "$target_id" != "auth-email-input" ]]; then
                echo "Simulator $field_label system paste target type is invalid." >&2
                return 1
              fi
            elif [[ "$field_role" == "password" ]]; then
              if [[ "$target_id" != "auth-password-input" ]]; then
                echo "Simulator $field_label system paste target is invalid." >&2
                return 1
              fi
            else
              echo "Simulator $field_label system paste role is invalid." >&2
              return 1
            fi

            set +e
            printf '%s' "$value" |
              run_bounded_menu_paste "$target_id" "$replace_mode" \
                >/dev/null 2>&1
            local -a pipeline_status=("${PIPESTATUS[@]}")
            set -e
            if (( ${#pipeline_status[@]} != 2 )) ||
               (( pipeline_status[0] != 0 || pipeline_status[1] != 0 )); then
              local paste_error="ERROR_TRANSPORT"
              if (( ${#pipeline_status[@]} == 2 )); then
                case "${pipeline_status[1]}" in
                  71) paste_error="ERROR_PASTE_MENU" ;;
                  72) paste_error="ERROR_SELECT_ALL_MENU" ;;
                  73) paste_error="ERROR_TARGET" ;;
                  74) paste_error="ERROR_PASTEBOARD" ;;
                  75) paste_error="ERROR_AMBIGUOUS_TARGET" ;;
                  124) paste_error="ERROR_TIMEOUT" ;;
                esac
              fi
              echo "Simulator $field_label bounded menu paste failed ($paste_error)." >&2
              return 1
            fi

            LAST_PASTE_TARGET_FRAME_X="$target_frame_x"
            LAST_PASTE_TARGET_FRAME_Y="$target_frame_y"
            LAST_PASTE_TARGET_FRAME_WIDTH="$target_frame_width"
            LAST_PASTE_TARGET_FRAME_HEIGHT="$target_frame_height"
            LAST_PASTE_TARGET_TYPE="$target_type"
            LAST_PASTE_TARGET_ID="$target_id"
            LAST_PASTE_TARGET_LABEL_HASH="$target_label_hash"
            LAST_PASTE_TARGET_VALUE_HASH="$target_value_hash"
          }

          secure_paste() {
            local replace_mode="${4:-true}"
            local input_status
            local approval_status=1
            local pasteboard_clear_status
            local settle_status=1
            local verification_status=1
            if paste_value "$1" "$2" "$3" "$replace_mode"; then
              input_status=0
            else
              input_status=$?
            fi
            if (( input_status == 0 )); then
              if run_sensitive_maestro_flow \
                   "approve-$3-protected-paste" \
                   "apps/mobile/.maestro/ios/approve-password-paste.yaml"; then
                approval_status=0
              else
                approval_status=$?
              fi
            fi
            if strict_clear_pasteboards; then
              pasteboard_clear_status=0
            else
              pasteboard_clear_status=$?
            fi
            if (( input_status == 0 )) &&
               (( approval_status == 0 )) &&
               (( pasteboard_clear_status == 0 )); then
              if sleep 2; then
                settle_status=0
              else
                settle_status=$?
              fi
            fi
            if (( settle_status == 0 )); then
              if verify_target_changed \
                   "$2" \
                   "$LAST_PASTE_TARGET_FRAME_X" \
                   "$LAST_PASTE_TARGET_FRAME_Y" \
                   "$LAST_PASTE_TARGET_FRAME_WIDTH" \
                   "$LAST_PASTE_TARGET_FRAME_HEIGHT" \
                   "$LAST_PASTE_TARGET_TYPE" \
                   "$LAST_PASTE_TARGET_ID" \
                   "$LAST_PASTE_TARGET_LABEL_HASH" \
                   "$LAST_PASTE_TARGET_VALUE_HASH"; then
                verification_status=0
              else
                verification_status=$?
              fi
            fi
            if (( input_status != 0 )) ||
               (( approval_status != 0 )) ||
               (( pasteboard_clear_status != 0 )) ||
               (( settle_status != 0 )) ||
               (( verification_status != 0 )); then
              echo "The protected Simulator paste phase failed." >&2
              return 1
            fi
            return 0
          }

          run_maestro_flow() {
            local phase_name="$1"
            local flow_path="$2"
            local output_dir="$3"
            local allow_startup_retry="$4"
            local attempt=1
            while true; do
              local attempt_log="$capture_debug_dir/maestro-$phase_name-attempt-$attempt.log"
              set +e
              env -u QA_EMAIL -u QA_PASSWORD \
                "$MAESTRO_BIN" --no-ansi --device "$SIMULATOR_UDID" \
                  test "$flow_path" \
                  --test-output-dir="$output_dir" \
                  >"$attempt_log" 2>&1
              local maestro_status=$?
              set -e

              if (( maestro_status == 0 )); then
                rm -f -- "$attempt_log"
                return 0
              fi
              if [[ "$allow_startup_retry" == "true" ]] &&
                 (( attempt == 1 )) &&
                 grep -Fq 'iOS driver not ready in time' "$attempt_log"; then
                echo "The iOS test driver timed out during $phase_name; retrying once." >&2
                rm -f -- "$attempt_log"
                attempt=2
                continue
              fi
              echo "The $phase_name Maestro phase failed." >&2
              return "$maestro_status"
            done
          }

          run_sensitive_maestro_flow() {
            local phase_name="$1"
            local flow_path="$2"
            local export_dir="${3:-}"
            local phase_dir="$sensitive_paste_root/$phase_name"
            local output_dir="$phase_dir/output"
            local attempt_log="$phase_dir/maestro.log"
            rm -rf -- "$phase_dir"
            mkdir -p "$output_dir"
            chmod 700 "$phase_dir" "$output_dir"

            local maestro_status
            set +e
            env \
              -u QA_EMAIL \
              -u QA_PASSWORD \
              -u SIM_USE_DEBUG \
              MAESTRO_DRIVER_STARTUP_TIMEOUT=60000 \
              "$MAESTRO_BIN" --no-ansi --device "$SIMULATOR_UDID" \
                test "$flow_path" \
                --test-output-dir="$output_dir" \
                >"$attempt_log" 2>&1
            maestro_status=$?
            set -e

            local export_status=0
            if [[ -n "$export_dir" ]]; then
              set +e
              rm -rf -- "$export_dir"
              export_status=$?
              if (( export_status == 0 && maestro_status == 0 )); then
                mkdir -p "$export_dir"
                export_status=$?
              fi
              if (( export_status == 0 && maestro_status == 0 )); then
                chmod 700 "$export_dir"
                export_status=$?
              fi
              if (( export_status == 0 && maestro_status == 0 )); then
                env \
                  -u QA_EMAIL \
                  -u QA_PASSWORD \
                  -u SIM_USE_DEBUG \
                  SENSITIVE_OUTPUT_DIR="$output_dir" \
                  SCREENSHOT_EXPORT_DIR="$export_dir" \
                  node <<'NODE' >"$phase_dir/export.log" 2>&1
          const fs = require("node:fs");
          const path = require("node:path");

          const sourceRoot = process.env.SENSITIVE_OUTPUT_DIR;
          const exportRoot = process.env.SCREENSHOT_EXPORT_DIR;
          const expectedNames = new Set([
            "01-home-score.png",
            "02-health-check.png",
            "03-health-flow.png",
            "04-account-pets.png",
            "05-report-summary.png",
          ]);
          const matches = new Map([...expectedNames].map((name) => [name, []]));
          const pngSignature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
          let entryCount = 0;

          function requireDirectory(directory, label) {
            const stat = fs.lstatSync(directory);
            if (stat.isSymbolicLink() || !stat.isDirectory()) {
              throw new Error(`${label} is not a real directory.`);
            }
          }

          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              entryCount += 1;
              if (entryCount > 2_000) {
                throw new Error("The protected capture output contains too many entries.");
              }
              const entryPath = path.join(directory, entry.name);
              const stat = fs.lstatSync(entryPath);
              if (stat.isSymbolicLink()) {
                throw new Error("Symbolic links are not permitted in protected capture output.");
              }
              if (stat.isDirectory()) {
                visit(entryPath);
                continue;
              }
              if (!stat.isFile()) {
                throw new Error("Only regular files are permitted in protected capture output.");
              }
              if (expectedNames.has(entry.name)) matches.get(entry.name).push(entryPath);
            }
          }

          requireDirectory(sourceRoot, "Protected capture output");
          requireDirectory(exportRoot, "Screenshot export target");
          visit(sourceRoot);

          for (const name of expectedNames) {
            const candidates = matches.get(name);
            if (candidates.length !== 1) {
              throw new Error(`Expected exactly one protected screenshot named ${name}.`);
            }
            const source = candidates[0];
            const stat = fs.lstatSync(source);
            if (stat.size < pngSignature.length || stat.size > 50_000_000) {
              throw new Error(`${name} has an invalid size.`);
            }
            const descriptor = fs.openSync(source, "r");
            const signature = Buffer.alloc(pngSignature.length);
            try {
              const bytesRead = fs.readSync(
                descriptor,
                signature,
                0,
                pngSignature.length,
                0,
              );
              if (bytesRead !== pngSignature.length || !signature.equals(pngSignature)) {
                throw new Error(`${name} is not a PNG file.`);
              }
            } finally {
              fs.closeSync(descriptor);
            }
            const destination = path.join(exportRoot, name);
            fs.copyFileSync(source, destination, fs.constants.COPYFILE_EXCL);
            fs.chmodSync(destination, 0o600);
          }
          NODE
                export_status=$?
              fi
              set -e
            fi

            local pasteboard_clear_status
            if strict_clear_pasteboards; then
              pasteboard_clear_status=0
            else
              pasteboard_clear_status=$?
            fi

            local delete_status
            set +e
            rm -rf -- "$phase_dir"
            delete_status=$?
            set -e

            if (( maestro_status != 0 )) ||
               (( export_status != 0 )) ||
               (( pasteboard_clear_status != 0 )) ||
               (( delete_status != 0 )); then
              if [[ -n "$export_dir" ]]; then
                rm -rf -- "$export_dir" >/dev/null 2>&1 || true
              fi
              echo "The protected Simulator paste phase failed." >&2
              return 1
            fi
            if [[ -n "$export_dir" ]]; then
              STORE_SCREENSHOT_EXPORT_COMPLETE="true"
            fi
            return 0
          }

          email_focus_output="$capture_debug_dir/focus-email"
          email_paste_output="$capture_debug_dir/approve-email-paste"

          run_maestro_flow \
            "focus-email" \
            "apps/mobile/.maestro/ios/focus-email.yaml" \
            "$email_focus_output" \
            "true"
          rm -rf -- "$email_focus_output"
          sleep 2
          paste_value "petflow@@paste-check" "public email sentinel" "email"
          run_maestro_flow \
            "approve-email-paste" \
            "apps/mobile/.maestro/ios/approve-password-paste.yaml" \
            "$email_paste_output" \
            "true"
          rm -rf -- "$email_paste_output"
          verify_target_changed \
            "public email sentinel" \
            "$LAST_PASTE_TARGET_FRAME_X" \
            "$LAST_PASTE_TARGET_FRAME_Y" \
            "$LAST_PASTE_TARGET_FRAME_WIDTH" \
            "$LAST_PASTE_TARGET_FRAME_HEIGHT" \
            "$LAST_PASTE_TARGET_TYPE" \
            "$LAST_PASTE_TARGET_ID" \
            "$LAST_PASTE_TARGET_LABEL_HASH" \
            "$LAST_PASTE_TARGET_VALUE_HASH"
          echo "Simulator system paste transport validated with a public probe."
          strict_clear_pasteboards
          sleep 1
          secure_paste "$qa_email" "email" "email"

          if ! sim_use tap \
               "#auth-password-input" \
               --post-delay 0.8 \
               --device "$SIMULATOR_UDID" \
               --json \
               >/dev/null 2>&1; then
            echo "Simulator password focus tap failed." >&2
            exit 1
          fi
          strict_clear_pasteboards
          sleep 1
          secure_paste "$qa_password" "password" "password" "false"

          qa_email=""
          qa_password=""
          unset qa_email qa_password
          echo "Protected QA credentials entered through Simulator paste input."
          run_sensitive_maestro_flow \
            "store-capture" \
            "apps/mobile/.maestro/ios/store-capture.yaml" \
            "$store_screenshot_export_dir"

      - name: Emit only sanitized UI text when capture fails
        if: failure() && steps.maestro_capture.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_ROOT="$RUNNER_TEMP/maestro-capture-output" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.DEBUG_ROOT;
          const extensions = new Set([".json", ".log", ".txt", ".xml", ".yaml", ".yml"]);
          const candidates = [];
          const diagnostics = [];
          const seen = new Set();
          const seenDiagnostics = new Set();
          let scannedBytes = 0;
          let scannedFiles = 0;
          const maxBytes = 32_000_000;
          const maxCandidates = 1_000;
          const maxFiles = 500;

          function sanitize(value) {
            return value
              .replace(/https?:\/\/[^\s"'<>]+/gi, "[REDACTED_URL]")
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[REDACTED_EMAIL]")
              .replace(/[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}/g, "[REDACTED_TOKEN]")
              .replace(/\b(?:\+?82[-.\s]?)?0?1[016789][-.\s]?\d{3,4}[-.\s]?\d{4}\b/g, "[REDACTED_PHONE]")
              .replace(/\b[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}\b/gi, "[REDACTED_ID]")
              .replace(/\b[a-f0-9]{32,}\b/gi, "[REDACTED_ID]")
              .replace(/\b[A-Za-z0-9_+\/-]{32,}={0,2}\b/g, "[REDACTED_OPAQUE_VALUE]")
              .replace(/\s+/g, " ")
              .trim();
          }

          function collect(value) {
            if (typeof value === "string") {
              const sanitized = sanitize(value);
              if (
                sanitized.length > 0 &&
                sanitized.length <= 500 &&
                /(?:assert|command|element|error|fail|not found|not visible|tapOn|timeout|waitUntil)/i.test(sanitized) &&
                !seenDiagnostics.has(sanitized) &&
                diagnostics.length < maxCandidates
              ) {
                seenDiagnostics.add(sanitized);
                diagnostics.push(sanitized);
              }
              if (
                sanitized.length > 0 &&
                sanitized.length <= 500 &&
                /[가-힣]/.test(sanitized) &&
                !seen.has(sanitized) &&
                candidates.length < maxCandidates
              ) {
                seen.add(sanitized);
                candidates.push(sanitized);
              }
              return;
            }
            if (Array.isArray(value)) {
              for (const item of value) collect(item);
              return;
            }
            if (value && typeof value === "object") {
              for (const item of Object.values(value)) collect(item);
            }
          }

          function visit(directory) {
            if (
              scannedBytes >= maxBytes ||
              scannedFiles >= maxFiles ||
              candidates.length >= maxCandidates
            ) return;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (
                scannedBytes >= maxBytes ||
                scannedFiles >= maxFiles ||
                candidates.length >= maxCandidates
              ) break;
              const filePath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                visit(filePath);
                continue;
              }
              const stat = fs.lstatSync(filePath);
              if (
                !stat.isFile() ||
                !extensions.has(path.extname(entry.name).toLowerCase()) ||
                stat.size > 8_000_000 ||
                scannedBytes + stat.size > maxBytes
              ) {
                continue;
              }
              scannedFiles += 1;
              scannedBytes += stat.size;
              const content = fs.readFileSync(filePath, "utf8");
              try {
                collect(JSON.parse(content));
              } catch {
                for (const line of content.split(/\r?\n/)) collect(line);
              }
            }
          }

          if (!root || !fs.existsSync(root)) {
            console.log("No Maestro debug directory was created.");
            process.exit(0);
          }
          visit(root);
          console.log("Sanitized Korean UI strings from the failed capture:");
          for (const value of candidates.slice(-200)) console.log(`- ${value}`);
          if (candidates.length === 0) console.log("- No Korean UI strings were found.");
          console.log("Sanitized failure diagnostics from the failed capture:");
          for (const value of diagnostics.slice(-80)) console.log(`- ${value}`);
          if (diagnostics.length === 0) console.log("- No failure diagnostics were found.");
          NODE

      - name: Normalize and verify only the five store screenshots
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          raw_dir="$RUNNER_TEMP/petflow-ios-capture-raw"
          output_dir="$RUNNER_TEMP/petflow-ios-capture"
          mkdir -p "$raw_dir" "$output_dir"

          expected_files=(
            01-home-score.png
            02-health-check.png
            03-health-flow.png
            04-account-pets.png
            05-report-summary.png
          )
          for file_name in "${expected_files[@]}"; do
            matches_file="$RUNNER_TEMP/matches-$file_name.txt"
            find "$RUNNER_TEMP/maestro-capture-output" \
              -type f -name "$file_name" -print > "$matches_file"
            match_count="$(wc -l < "$matches_file" | tr -d '[:space:]')"
            if [[ "$match_count" != "1" ]]; then
              echo "Expected one captured $file_name; found $match_count." >&2
              exit 1
            fi
            cp "$(head -n 1 "$matches_file")" "$raw_dir/$file_name"
          done

          CAPTURE_RAW_DIR="$raw_dir" \
          CAPTURE_OUTPUT_DIR="$output_dir" \
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";
          import sharp from "sharp";

          const expectedFiles = [
            "01-home-score.png",
            "02-health-check.png",
            "03-health-flow.png",
            "04-account-pets.png",
            "05-report-summary.png",
          ];
          const rawDir = process.env.CAPTURE_RAW_DIR;
          const outputDir = process.env.CAPTURE_OUTPUT_DIR;
          const hashes = {};

          for (const fileName of expectedFiles) {
            const input = path.join(rawDir, fileName);
            const output = path.join(outputDir, fileName);
            await sharp(input)
              .removeAlpha()
              .png({ compressionLevel: 9 })
              .toFile(output);
            const metadata = await sharp(output).metadata();
            if (
              metadata.width !== 1290 ||
              metadata.height !== 2796 ||
              metadata.hasAlpha !== false ||
              metadata.channels !== 3
            ) {
              throw new Error(
                fileName + " is not an opaque 1290x2796 RGB PNG.",
              );
            }
            hashes[fileName] = crypto
              .createHash("sha256")
              .update(fs.readFileSync(output))
              .digest("hex");
          }

          const runtimeChanges = execFileSync(
            "git",
            [
              "diff",
              "--name-only",
              process.env.RUNTIME_BASE_COMMIT + ".." + process.env.GITHUB_SHA,
            ],
            {
              cwd: process.env.GITHUB_WORKSPACE,
              encoding: "utf8",
            },
          )
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .sort();

          const metadata = {
            source: "github-actions-ios-simulator",
            capturedAt: new Date().toISOString(),
            captureCommit: process.env.GITHUB_SHA,
            captureHarness: {
              runtimePatchSha256: process.env.CAPTURE_RUNTIME_PATCH_SHA256,
              stableInputIdentifiers: true,
              boundedMenuPaste: true,
              sanitizedPasteDiagnostics: true,
              accessibilityValueHashVerification: true,
              layoutTolerantValueVerification: true,
              packageBoundScreenVerification: true,
              passwordUsesAppAutoFocus: true,
              passwordUsesEmptyFieldPaste: true,
              protectedPasteApproval: true,
              protectedValueReplacement: true,
              visualChanges: false,
            },
            productionTarget: {
              easBuildId: process.env.PRODUCTION_EAS_BUILD_ID,
              buildNumber: process.env.PRODUCTION_BUILD_NUMBER,
              runtimeCommit: process.env.RUNTIME_BASE_COMMIT,
            },
            simulatorBuild: {
              easBuildId: process.env.EAS_SIMULATOR_BUILD_ID,
              buildNumber: process.env.EAS_SIMULATOR_BUILD_NUMBER,
              binaryBuildNumber:
                process.env.EAS_SIMULATOR_BINARY_BUILD_NUMBER,
              commit: process.env.EAS_SIMULATOR_BUILD_COMMIT,
              profile: process.env.EAS_SIMULATOR_BUILD_PROFILE,
              distribution:
                process.env.EAS_SIMULATOR_BUILD_DISTRIBUTION.toUpperCase(),
              isForIosSimulator:
                process.env.EAS_SIMULATOR_IS_SIMULATOR.toLowerCase() === "true",
              artifactSha256:
                process.env.EAS_SIMULATOR_ARTIFACT_SHA256.toLowerCase(),
            },
            device: {
              name: process.env.IOS_DEVICE_NAME,
              runtime: process.env.IOS_RUNTIME_NAME,
              width: 1290,
              height: 2796,
              alpha: false,
            },
            runtimeChanges,
            files: hashes,
          };
          fs.writeFileSync(
            path.join(outputDir, "capture-metadata.json"),
            JSON.stringify(metadata, null, 2) + "\n",
            "utf8",
          );
          NODE

          file_count="$(find "$output_dir" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$file_count" != "6" ]]; then
            echo "The upload directory must contain five PNGs and one metadata file." >&2
            exit 1
          fi

      - name: Upload only screenshots and non-sensitive metadata
        uses: actions/upload-artifact@v4
        with:
          name: petflow-ios-build32-simulator-${{ env.EAS_SIMULATOR_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/petflow-ios-capture/01-home-score.png
            ${{ runner.temp }}/petflow-ios-capture/02-health-check.png
            ${{ runner.temp }}/petflow-ios-capture/03-health-flow.png
            ${{ runner.temp }}/petflow-ios-capture/04-account-pets.png
            ${{ runner.temp }}/petflow-ios-capture/05-report-summary.png
            ${{ runner.temp }}/petflow-ios-capture/capture-metadata.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove the ephemeral Simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            printf '' | xcrun simctl pbcopy "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi
          /usr/bin/pbcopy </dev/null >/dev/null 2>&1 || true
