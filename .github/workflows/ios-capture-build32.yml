name: PetFlow iOS build 32 simulator capture

on:
  push:
    branches:
      - codex/ios-capture-build32

permissions:
  contents: read

concurrency:
  group: petflow-ios-capture-build32
  cancel-in-progress: false

env:
  RUNTIME_BASE_COMMIT: 65fe4d081769f35e876353e597c26f0a63cf6efe
  CAPTURE_BRANCH: codex/ios-capture-build32
  EAS_BUILD_PROFILE: ios-store-screenshot-ci
  PRODUCTION_EAS_BUILD_ID: 174779e0-899c-4f04-b31a-b886c6deba61
  PRODUCTION_BUILD_NUMBER: "32"
  IOS_APP_VERSION: "1.0"
  IOS_BUNDLE_ID: com.beflow.petflow
  IOS_DEVICE_NAME: iPhone 16 Plus
  IOS_RUNTIME_NAME: iOS 18.5
  MAESTRO_VERSION: 2.7.0
  MAESTRO_ZIP_SHA256: a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_DISABLE_UPDATE_CHECK: "true"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
  SIM_USE_VERSION: 0.13.0
  SIM_USE_ARCHIVE_SHA256: f3da237663199faf4c7f6796c3ede6ce7583da872dc27d92eb3b7eb051725081
  SIM_USE_NO_DAEMON: "1"
  SIM_USE_HID_STABILIZATION_MS: "1000"

jobs:
  capture:
    name: Capture actual iOS Simulator screens
    runs-on: macos-15
    timeout-minutes: 35
    environment: petflow-ios-capture
    env:
      EAS_SIMULATOR_ARTIFACT_SHA256: ${{ vars.EAS_SIMULATOR_ARTIFACT_SHA256 }}
      EAS_SIMULATOR_BINARY_BUILD_NUMBER: ${{ vars.EAS_SIMULATOR_BINARY_BUILD_NUMBER }}
      EAS_SIMULATOR_BUILD_ID: ${{ vars.EAS_SIMULATOR_BUILD_ID }}
      EAS_SIMULATOR_BUILD_NUMBER: ${{ vars.EAS_SIMULATOR_BUILD_NUMBER }}
      EAS_SIMULATOR_BUILD_COMMIT: ${{ vars.EAS_SIMULATOR_BUILD_COMMIT }}
      EAS_SIMULATOR_BUILD_PROFILE: ${{ vars.EAS_SIMULATOR_BUILD_PROFILE }}
      EAS_SIMULATOR_BUILD_DISTRIBUTION: ${{ vars.EAS_SIMULATOR_BUILD_DISTRIBUTION }}
      EAS_SIMULATOR_IS_SIMULATOR: ${{ vars.EAS_SIMULATOR_IS_SIMULATOR }}

    steps:
      - name: Check out the capture commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify the temporary branch has no runtime changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$CAPTURE_BRANCH" ]]; then
            echo "Unexpected capture ref." >&2
            exit 1
          fi

          merge_base="$(git merge-base "$RUNTIME_BASE_COMMIT" "$GITHUB_SHA")"
          if [[ "$merge_base" != "$RUNTIME_BASE_COMMIT" ]]; then
            echo "The capture branch is not based on the approved runtime commit." >&2
            exit 1
          fi

          actual_paths="$(git diff --name-only "$RUNTIME_BASE_COMMIT..$GITHUB_SHA" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/ios-capture-build32.yml' \
            'apps/mobile/.maestro/ios/focus-email.yaml' \
            'apps/mobile/.maestro/ios/focus-password.yaml' \
            'apps/mobile/.maestro/ios/store-capture.yaml' \
            'apps/mobile/eas.json' | LC_ALL=C sort)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo "The temporary branch contains files outside the capture-only allowlist." >&2
            printf '%s\n' "$actual_paths" >&2
            exit 1
          fi

          git diff --quiet "$RUNTIME_BASE_COMMIT" "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/ios-capture-build32.yml' \
            ':(exclude)apps/mobile/.maestro/ios/focus-email.yaml' \
            ':(exclude)apps/mobile/.maestro/ios/focus-password.yaml' \
            ':(exclude)apps/mobile/.maestro/ios/store-capture.yaml' \
            ':(exclude)apps/mobile/eas.json'

      - name: Verify the additive EAS profile and supplied build metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const baseSha = process.env.RUNTIME_BASE_COMMIT;
          const base = JSON.parse(
            execFileSync(
              "git",
              ["show", baseSha + ":apps/mobile/eas.json"],
              { encoding: "utf8" },
            ),
          );
          const current = JSON.parse(
            fs.readFileSync("apps/mobile/eas.json", "utf8"),
          );
          const profileName = process.env.EAS_BUILD_PROFILE;
          const profile = current.build?.[profileName];

          assert.deepEqual(profile, {
            extends: "production",
            environment: "production",
            autoIncrement: true,
            withoutCredentials: true,
            ios: {
              simulator: true,
              buildConfiguration: "Release",
            },
          });
          const withoutCaptureProfile = structuredClone(current);
          delete withoutCaptureProfile.build[profileName];
          assert.deepEqual(withoutCaptureProfile, base);
          NODE

          required_vars=(
            EAS_SIMULATOR_ARTIFACT_SHA256
            EAS_SIMULATOR_BINARY_BUILD_NUMBER
            EAS_SIMULATOR_BUILD_ID
            EAS_SIMULATOR_BUILD_NUMBER
            EAS_SIMULATOR_BUILD_COMMIT
            EAS_SIMULATOR_BUILD_PROFILE
            EAS_SIMULATOR_BUILD_DISTRIBUTION
            EAS_SIMULATOR_IS_SIMULATOR
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Protected environment variable $name is missing." >&2
              exit 1
            fi
          done

          normalized_sha="$(printf '%s' "$EAS_SIMULATOR_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$normalized_sha" =~ ^[a-f0-9]{64}$ ]]; then
            echo "The supplied artifact SHA-256 is invalid." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "The supplied EAS build ID is invalid." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BINARY_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "The supplied Simulator binary build number is invalid." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_COMMIT" =~ ^[a-f0-9]{40}$ ]] ||
             ! git merge-base --is-ancestor "$EAS_SIMULATOR_BUILD_COMMIT" "$GITHUB_SHA"; then
            echo "The Simulator build commit is not an ancestor of the capture commit." >&2
            exit 1
          fi
          post_build_changes="$(
            git diff --name-only "$EAS_SIMULATOR_BUILD_COMMIT..$GITHUB_SHA" |
              while IFS= read -r changed_path; do
                if [[ "$changed_path" != ".github/workflows/ios-capture-build32.yml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/focus-email.yaml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/focus-password.yaml" ]] &&
                   [[ "$changed_path" != "apps/mobile/.maestro/ios/store-capture.yaml" ]]; then
                  printf '%s\n' "$changed_path"
                fi
              done
          )"
          if [[ -n "$post_build_changes" ]]; then
            echo "Files outside the capture harness changed after the Simulator build." >&2
            printf '%s\n' "$post_build_changes" >&2
            exit 1
          fi
          if [[ "$EAS_SIMULATOR_BUILD_PROFILE" != "$EAS_BUILD_PROFILE" ]]; then
            echo "The Simulator build profile is unexpected." >&2
            exit 1
          fi
          normalized_distribution="$(printf '%s' "$EAS_SIMULATOR_BUILD_DISTRIBUTION" | tr '[:lower:]' '[:upper:]')"
          normalized_simulator="$(printf '%s' "$EAS_SIMULATOR_IS_SIMULATOR" | tr '[:upper:]' '[:lower:]')"
          if [[ "$normalized_distribution" != "STORE" ]] ||
             [[ "$normalized_simulator" != "true" ]]; then
            echo "The supplied EAS build metadata is not a Store-profile iOS Simulator build." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_NUMBER" =~ ^[0-9]+$ ]] ||
             (( EAS_SIMULATOR_BUILD_NUMBER <= PRODUCTION_BUILD_NUMBER )); then
            echo "The Simulator build number must be distinct from production build 32." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java for Maestro
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Select the pinned Xcode runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Download and verify the EAS Simulator artifact
        shell: bash
        env:
          EAS_SIMULATOR_ARTIFACT_URL: ${{ secrets.EAS_SIMULATOR_ARTIFACT_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${EAS_SIMULATOR_ARTIFACT_URL:-}" ]] ||
             [[ "$EAS_SIMULATOR_ARTIFACT_URL" != https://* ]]; then
            echo "A protected HTTPS EAS artifact URL is required." >&2
            exit 1
          fi

          archive="$RUNNER_TEMP/petflow-ios-simulator-artifact"
          extract_dir="$RUNNER_TEMP/petflow-ios-simulator-app"
          mkdir -p "$extract_dir"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "$EAS_SIMULATOR_ARTIFACT_URL" \
            --output "$archive"

          expected_sha="$(printf '%s' "$EAS_SIMULATOR_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "The EAS artifact SHA-256 does not match the protected value." >&2
            exit 1
          fi

          if unzip -tqq "$archive" >/dev/null 2>&1; then
            ditto -x -k "$archive" "$extract_dir"
          elif tar -tf "$archive" >/dev/null 2>&1; then
            tar -xf "$archive" -C "$extract_dir"
          else
            echo "The verified EAS artifact is not a supported archive." >&2
            exit 1
          fi

          app_paths="$RUNNER_TEMP/petflow-ios-app-paths.txt"
          find "$extract_dir" -type d -name '*.app' -prune -print > "$app_paths"
          app_count="$(wc -l < "$app_paths" | tr -d '[:space:]')"
          if [[ "$app_count" != "1" ]]; then
            echo "Expected exactly one iOS Simulator .app bundle." >&2
            exit 1
          fi
          app_path="$(head -n 1 "$app_paths")"
          info_plist="$app_path/Info.plist"
          if [[ ! -f "$info_plist" ]]; then
            echo "The Simulator app has no Info.plist." >&2
            exit 1
          fi

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          if [[ "$bundle_id" != "$IOS_BUNDLE_ID" ]] ||
             [[ "$app_version" != "$IOS_APP_VERSION" ]] ||
             [[ "$build_number" != "$EAS_SIMULATOR_BINARY_BUILD_NUMBER" ]]; then
            echo "The Simulator app identity does not match the protected metadata." >&2
            exit 1
          fi
          architectures="$(lipo -archs "$app_path/$executable_name")"
          if [[ " $architectures " != *" arm64 "* ]]; then
            echo "The Simulator app cannot run on the arm64 macOS runner." >&2
            exit 1
          fi

          {
            echo "APP_PATH<<PETFLOW_APP_PATH"
            echo "$app_path"
            echo "PETFLOW_APP_PATH"
          } >> "$GITHUB_ENV"

      - name: Boot an exact-size iPhone Simulator and install PetFlow
        shell: bash
        run: |
          set -euo pipefail

          runtime_id="$(xcrun simctl list runtimes -j | jq -r \
            --arg name "$IOS_RUNTIME_NAME" \
            '.runtimes[] | select(.name == $name and .isAvailable == true) | .identifier' |
            head -n 1)"
          device_type_id="$(xcrun simctl list devicetypes -j | jq -r \
            --arg name "$IOS_DEVICE_NAME" \
            '.devicetypes[] | select(.name == $name) | .identifier' |
            head -n 1)"
          if [[ -z "$runtime_id" ]] || [[ -z "$device_type_id" ]]; then
            echo "The pinned iPhone 16 Plus / iOS 18.5 Simulator is unavailable." >&2
            exit 1
          fi

          simulator_udid="$(xcrun simctl create \
            'PetFlow build 32 capture' "$device_type_id" "$runtime_id")"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          open -a Simulator --args -CurrentDeviceUDID "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl status_bar "$simulator_udid" override \
            --time '9:41' \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl install "$simulator_udid" "$APP_PATH"
          xcrun simctl get_app_container "$simulator_udid" "$IOS_BUNDLE_ID" app >/dev/null

      - name: Install exact mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          maestro_zip="$RUNNER_TEMP/maestro-$MAESTRO_VERSION.zip"
          maestro_dir="$RUNNER_TEMP/maestro-$MAESTRO_VERSION"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip" \
            --output "$maestro_zip"
          actual_maestro_sha="$(shasum -a 256 "$maestro_zip" | awk '{print $1}')"
          if [[ "$actual_maestro_sha" != "$MAESTRO_ZIP_SHA256" ]]; then
            echo "The Maestro archive SHA-256 does not match the pinned release." >&2
            exit 1
          fi
          unzip -q "$maestro_zip" -d "$maestro_dir"
          test -x "$maestro_dir/maestro/bin/maestro"
          echo "MAESTRO_BIN=$maestro_dir/maestro/bin/maestro" >> "$GITHUB_ENV"

      - name: Install pinned Simulator HID CLI
        shell: bash
        run: |
          set -euo pipefail
          sim_use_archive="$RUNNER_TEMP/sim-use-$SIM_USE_VERSION.tar.gz"
          sim_use_dir="$RUNNER_TEMP/sim-use-$SIM_USE_VERSION"
          mkdir -p "$sim_use_dir"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "https://github.com/lycorp-jp/sim-use/releases/download/v$SIM_USE_VERSION/sim-use-v$SIM_USE_VERSION.tar.gz" \
            --output "$sim_use_archive"
          actual_sim_use_sha="$(shasum -a 256 "$sim_use_archive" | awk '{print $1}')"
          if [[ "$actual_sim_use_sha" != "$SIM_USE_ARCHIVE_SHA256" ]]; then
            echo "The sim-use archive SHA-256 does not match the pinned release." >&2
            exit 1
          fi
          tar -xzf "$sim_use_archive" -C "$sim_use_dir"
          sim_use_bin="$sim_use_dir/sim-use"
          test -x "$sim_use_bin"
          codesign --force --sign - --timestamp=none "$sim_use_bin"
          codesign --verify --strict "$sim_use_bin"
          version_output="$("$sim_use_bin" --version)"
          if [[ "$version_output" != *"$SIM_USE_VERSION"* ]]; then
            echo "The sim-use binary version does not match the pinned release." >&2
            exit 1
          fi
          echo "SIM_USE_BIN=$sim_use_bin" >> "$GITHUB_ENV"

      - name: Run the synthetic store-review capture flow
        id: maestro_capture
        shell: bash
        env:
          QA_EMAIL: ${{ secrets.PETFLOW_QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.PETFLOW_QA_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${QA_EMAIL:-}" ]] || [[ -z "${QA_PASSWORD:-}" ]]; then
            echo "Protected QA credentials are required." >&2
            exit 1
          fi

          node <<'NODE'
          const email = process.env.QA_EMAIL ?? "";
          const password = process.env.QA_PASSWORD ?? "";
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          const printableAscii = /^[\x21-\x7e]+$/;

          if (
            email !== email.trim() ||
            !emailPattern.test(email) ||
            !printableAscii.test(email)
          ) {
            throw new Error("The protected QA email shape is invalid.");
          }
          if (
            password.length < 12 ||
            password.length > 64 ||
            !printableAscii.test(password)
          ) {
            throw new Error("The protected QA password shape is invalid.");
          }
          console.log("Protected QA credential shape validated.");
          NODE

          capture_debug_dir="$RUNNER_TEMP/maestro-capture-output"
          mkdir -p "$capture_debug_dir"
          chmod 700 "$capture_debug_dir"

          sim_use() {
            env \
              -u QA_EMAIL \
              -u QA_PASSWORD \
              -u SIM_USE_DEBUG \
              SIM_USE_NO_DAEMON="$SIM_USE_NO_DAEMON" \
              SIM_USE_HID_STABILIZATION_MS="$SIM_USE_HID_STABILIZATION_MS" \
              "$SIM_USE_BIN" "$@"
          }

          secure_type() {
            local value="$1"
            local field_label="$2"
            set +e
            printf '%s' "$value" |
              sim_use type --stdin --device "$SIMULATOR_UDID" --json \
                >/dev/null 2>&1
            local -a pipeline_status=("${PIPESTATUS[@]}")
            set -e
            if (( pipeline_status[1] != 0 )); then
              echo "Simulator HID $field_label entry failed." >&2
              return 1
            fi
          }

          run_maestro_flow() {
            local phase_name="$1"
            local flow_path="$2"
            local output_dir="$3"
            local allow_startup_retry="$4"
            local attempt=1
            while true; do
              local attempt_log="$capture_debug_dir/maestro-$phase_name-attempt-$attempt.log"
              set +e
              env -u QA_EMAIL -u QA_PASSWORD \
                "$MAESTRO_BIN" --no-ansi --device "$SIMULATOR_UDID" \
                  test "$flow_path" \
                  --test-output-dir="$output_dir" \
                  >"$attempt_log" 2>&1
              local maestro_status=$?
              set -e

              if (( maestro_status == 0 )); then
                rm -f -- "$attempt_log"
                return 0
              fi
              if [[ "$allow_startup_retry" == "true" ]] &&
                 (( attempt == 1 )) &&
                 grep -Fq 'iOS driver not ready in time' "$attempt_log"; then
                echo "The iOS test driver timed out during $phase_name; retrying once." >&2
                rm -f -- "$attempt_log"
                attempt=2
                continue
              fi
              echo "The $phase_name Maestro phase failed." >&2
              return "$maestro_status"
            done
          }

          email_focus_output="$capture_debug_dir/focus-email"
          password_focus_output="$capture_debug_dir/focus-password"
          store_capture_output="$capture_debug_dir/store-capture"

          run_maestro_flow \
            "focus-email" \
            "apps/mobile/.maestro/ios/focus-email.yaml" \
            "$email_focus_output" \
            "true"
          rm -rf -- "$email_focus_output"
          sleep 2
          secure_type "$QA_EMAIL" "email"
          sleep 1

          run_maestro_flow \
            "focus-password" \
            "apps/mobile/.maestro/ios/focus-password.yaml" \
            "$password_focus_output" \
            "true"
          rm -rf -- "$password_focus_output"
          sleep 2
          secure_type "$QA_PASSWORD" "password"
          sleep 1

          unset QA_EMAIL QA_PASSWORD
          echo "Protected QA credentials entered through Simulator HID input."
          run_maestro_flow \
            "store-capture" \
            "apps/mobile/.maestro/ios/store-capture.yaml" \
            "$store_capture_output" \
            "false"

      - name: Emit only sanitized UI text when capture fails
        if: failure() && steps.maestro_capture.outcome == 'failure'
        shell: bash
        env:
          QA_EMAIL: ${{ secrets.PETFLOW_QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.PETFLOW_QA_PASSWORD }}
        run: |
          set -euo pipefail
          DEBUG_ROOT="$RUNNER_TEMP/maestro-capture-output" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.DEBUG_ROOT;
          const extensions = new Set([".json", ".log", ".txt", ".xml", ".yaml", ".yml"]);
          const secrets = [process.env.QA_EMAIL, process.env.QA_PASSWORD].filter(Boolean);
          const candidates = [];
          const diagnostics = [];
          const seen = new Set();
          const seenDiagnostics = new Set();
          let scannedBytes = 0;
          let scannedFiles = 0;
          const maxBytes = 32_000_000;
          const maxCandidates = 1_000;
          const maxFiles = 500;

          function sanitize(value) {
            let result = value;
            for (const secret of secrets) {
              result = result.split(secret).join("[REDACTED_QA_VALUE]");
            }
            return result
              .replace(/https?:\/\/[^\s"'<>]+/gi, "[REDACTED_URL]")
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[REDACTED_EMAIL]")
              .replace(/[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}/g, "[REDACTED_TOKEN]")
              .replace(/\b(?:\+?82[-.\s]?)?0?1[016789][-.\s]?\d{3,4}[-.\s]?\d{4}\b/g, "[REDACTED_PHONE]")
              .replace(/\b[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}\b/gi, "[REDACTED_ID]")
              .replace(/\b[a-f0-9]{32,}\b/gi, "[REDACTED_ID]")
              .replace(/\b[A-Za-z0-9_+\/-]{32,}={0,2}\b/g, "[REDACTED_OPAQUE_VALUE]")
              .replace(/\s+/g, " ")
              .trim();
          }

          function collect(value) {
            if (typeof value === "string") {
              const sanitized = sanitize(value);
              if (
                sanitized.length > 0 &&
                sanitized.length <= 500 &&
                /(?:assert|command|element|error|fail|not found|not visible|tapOn|timeout|waitUntil)/i.test(sanitized) &&
                !seenDiagnostics.has(sanitized) &&
                diagnostics.length < maxCandidates
              ) {
                seenDiagnostics.add(sanitized);
                diagnostics.push(sanitized);
              }
              if (
                sanitized.length > 0 &&
                sanitized.length <= 500 &&
                /[가-힣]/.test(sanitized) &&
                !seen.has(sanitized) &&
                candidates.length < maxCandidates
              ) {
                seen.add(sanitized);
                candidates.push(sanitized);
              }
              return;
            }
            if (Array.isArray(value)) {
              for (const item of value) collect(item);
              return;
            }
            if (value && typeof value === "object") {
              for (const item of Object.values(value)) collect(item);
            }
          }

          function visit(directory) {
            if (
              scannedBytes >= maxBytes ||
              scannedFiles >= maxFiles ||
              candidates.length >= maxCandidates
            ) return;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (
                scannedBytes >= maxBytes ||
                scannedFiles >= maxFiles ||
                candidates.length >= maxCandidates
              ) break;
              const filePath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                visit(filePath);
                continue;
              }
              const stat = fs.lstatSync(filePath);
              if (
                !stat.isFile() ||
                !extensions.has(path.extname(entry.name).toLowerCase()) ||
                stat.size > 8_000_000 ||
                scannedBytes + stat.size > maxBytes
              ) {
                continue;
              }
              scannedFiles += 1;
              scannedBytes += stat.size;
              const content = fs.readFileSync(filePath, "utf8");
              try {
                collect(JSON.parse(content));
              } catch {
                for (const line of content.split(/\r?\n/)) collect(line);
              }
            }
          }

          if (!root || !fs.existsSync(root)) {
            console.log("No Maestro debug directory was created.");
            process.exit(0);
          }
          visit(root);
          console.log("Sanitized Korean UI strings from the failed capture:");
          for (const value of candidates.slice(-200)) console.log(`- ${value}`);
          if (candidates.length === 0) console.log("- No Korean UI strings were found.");
          console.log("Sanitized failure diagnostics from the failed capture:");
          for (const value of diagnostics.slice(-80)) console.log(`- ${value}`);
          if (diagnostics.length === 0) console.log("- No failure diagnostics were found.");
          NODE

      - name: Normalize and verify only the five store screenshots
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          raw_dir="$RUNNER_TEMP/petflow-ios-capture-raw"
          output_dir="$RUNNER_TEMP/petflow-ios-capture"
          mkdir -p "$raw_dir" "$output_dir"

          expected_files=(
            01-home-score.png
            02-health-check.png
            03-health-flow.png
            04-account-pets.png
            05-report-summary.png
          )
          for file_name in "${expected_files[@]}"; do
            matches_file="$RUNNER_TEMP/matches-$file_name.txt"
            find "$RUNNER_TEMP/maestro-capture-output" \
              -type f -name "$file_name" -print > "$matches_file"
            match_count="$(wc -l < "$matches_file" | tr -d '[:space:]')"
            if [[ "$match_count" != "1" ]]; then
              echo "Expected one captured $file_name; found $match_count." >&2
              exit 1
            fi
            cp "$(head -n 1 "$matches_file")" "$raw_dir/$file_name"
          done

          CAPTURE_RAW_DIR="$raw_dir" \
          CAPTURE_OUTPUT_DIR="$output_dir" \
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";
          import sharp from "sharp";

          const expectedFiles = [
            "01-home-score.png",
            "02-health-check.png",
            "03-health-flow.png",
            "04-account-pets.png",
            "05-report-summary.png",
          ];
          const rawDir = process.env.CAPTURE_RAW_DIR;
          const outputDir = process.env.CAPTURE_OUTPUT_DIR;
          const hashes = {};

          for (const fileName of expectedFiles) {
            const input = path.join(rawDir, fileName);
            const output = path.join(outputDir, fileName);
            await sharp(input)
              .removeAlpha()
              .png({ compressionLevel: 9 })
              .toFile(output);
            const metadata = await sharp(output).metadata();
            if (
              metadata.width !== 1290 ||
              metadata.height !== 2796 ||
              metadata.hasAlpha !== false ||
              metadata.channels !== 3
            ) {
              throw new Error(
                fileName + " is not an opaque 1290x2796 RGB PNG.",
              );
            }
            hashes[fileName] = crypto
              .createHash("sha256")
              .update(fs.readFileSync(output))
              .digest("hex");
          }

          const runtimeChanges = execFileSync(
            "git",
            [
              "diff",
              "--name-only",
              process.env.RUNTIME_BASE_COMMIT + ".." + process.env.GITHUB_SHA,
            ],
            {
              cwd: process.env.GITHUB_WORKSPACE,
              encoding: "utf8",
            },
          )
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .sort();

          const metadata = {
            source: "github-actions-ios-simulator",
            capturedAt: new Date().toISOString(),
            captureCommit: process.env.GITHUB_SHA,
            productionTarget: {
              easBuildId: process.env.PRODUCTION_EAS_BUILD_ID,
              buildNumber: process.env.PRODUCTION_BUILD_NUMBER,
              runtimeCommit: process.env.RUNTIME_BASE_COMMIT,
            },
            simulatorBuild: {
              easBuildId: process.env.EAS_SIMULATOR_BUILD_ID,
              buildNumber: process.env.EAS_SIMULATOR_BUILD_NUMBER,
              binaryBuildNumber:
                process.env.EAS_SIMULATOR_BINARY_BUILD_NUMBER,
              commit: process.env.EAS_SIMULATOR_BUILD_COMMIT,
              profile: process.env.EAS_SIMULATOR_BUILD_PROFILE,
              distribution:
                process.env.EAS_SIMULATOR_BUILD_DISTRIBUTION.toUpperCase(),
              isForIosSimulator:
                process.env.EAS_SIMULATOR_IS_SIMULATOR.toLowerCase() === "true",
              artifactSha256:
                process.env.EAS_SIMULATOR_ARTIFACT_SHA256.toLowerCase(),
            },
            device: {
              name: process.env.IOS_DEVICE_NAME,
              runtime: process.env.IOS_RUNTIME_NAME,
              width: 1290,
              height: 2796,
              alpha: false,
            },
            runtimeChanges,
            files: hashes,
          };
          fs.writeFileSync(
            path.join(outputDir, "capture-metadata.json"),
            JSON.stringify(metadata, null, 2) + "\n",
            "utf8",
          );
          NODE

          file_count="$(find "$output_dir" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$file_count" != "6" ]]; then
            echo "The upload directory must contain five PNGs and one metadata file." >&2
            exit 1
          fi

      - name: Upload only screenshots and non-sensitive metadata
        uses: actions/upload-artifact@v4
        with:
          name: petflow-ios-build32-simulator-${{ env.EAS_SIMULATOR_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/petflow-ios-capture/01-home-score.png
            ${{ runner.temp }}/petflow-ios-capture/02-health-check.png
            ${{ runner.temp }}/petflow-ios-capture/03-health-flow.png
            ${{ runner.temp }}/petflow-ios-capture/04-account-pets.png
            ${{ runner.temp }}/petflow-ios-capture/05-report-summary.png
            ${{ runner.temp }}/petflow-ios-capture/capture-metadata.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove the ephemeral Simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi
