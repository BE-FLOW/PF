name: PetFlow iOS build 32 simulator capture

on:
  push:
    branches:
      - codex/ios-capture-build32

permissions:
  contents: read

concurrency:
  group: petflow-ios-capture-build32
  cancel-in-progress: false

env:
  RUNTIME_BASE_COMMIT: 65fe4d081769f35e876353e597c26f0a63cf6efe
  CAPTURE_BRANCH: codex/ios-capture-build32
  EAS_BUILD_PROFILE: ios-store-screenshot-ci
  PRODUCTION_EAS_BUILD_ID: 174779e0-899c-4f04-b31a-b886c6deba61
  PRODUCTION_BUILD_NUMBER: "32"
  IOS_APP_VERSION: "1.0"
  IOS_BUNDLE_ID: com.beflow.petflow
  IOS_DEVICE_NAME: iPhone 16 Plus
  IOS_RUNTIME_NAME: iOS 18.5
  MAESTRO_VERSION: 2.6.1
  MAESTRO_ZIP_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b

jobs:
  capture:
    name: Capture actual iOS Simulator screens
    runs-on: macos-15
    timeout-minutes: 35
    environment: petflow-ios-capture
    env:
      EAS_SIMULATOR_ARTIFACT_SHA256: ${{ vars.EAS_SIMULATOR_ARTIFACT_SHA256 }}
      EAS_SIMULATOR_BUILD_ID: ${{ vars.EAS_SIMULATOR_BUILD_ID }}
      EAS_SIMULATOR_BUILD_NUMBER: ${{ vars.EAS_SIMULATOR_BUILD_NUMBER }}
      EAS_SIMULATOR_BUILD_COMMIT: ${{ vars.EAS_SIMULATOR_BUILD_COMMIT }}
      EAS_SIMULATOR_BUILD_PROFILE: ${{ vars.EAS_SIMULATOR_BUILD_PROFILE }}
      EAS_SIMULATOR_BUILD_DISTRIBUTION: ${{ vars.EAS_SIMULATOR_BUILD_DISTRIBUTION }}

    steps:
      - name: Check out the capture commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify the temporary branch has no runtime changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$CAPTURE_BRANCH" ]]; then
            echo "Unexpected capture ref." >&2
            exit 1
          fi

          merge_base="$(git merge-base "$RUNTIME_BASE_COMMIT" "$GITHUB_SHA")"
          if [[ "$merge_base" != "$RUNTIME_BASE_COMMIT" ]]; then
            echo "The capture branch is not based on the approved runtime commit." >&2
            exit 1
          fi

          actual_paths="$(git diff --name-only "$RUNTIME_BASE_COMMIT..$GITHUB_SHA" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/ios-capture-build32.yml' \
            'apps/mobile/.maestro/ios/store-capture.yaml' \
            'apps/mobile/eas.json' | LC_ALL=C sort)"
          if [[ "$actual_paths" != "$expected_paths" ]]; then
            echo "The temporary branch contains files outside the capture-only allowlist." >&2
            printf '%s\n' "$actual_paths" >&2
            exit 1
          fi

          git diff --quiet "$RUNTIME_BASE_COMMIT" "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/ios-capture-build32.yml' \
            ':(exclude)apps/mobile/.maestro/ios/store-capture.yaml' \
            ':(exclude)apps/mobile/eas.json'

      - name: Verify the additive EAS profile and supplied build metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const baseSha = process.env.RUNTIME_BASE_COMMIT;
          const base = JSON.parse(
            execFileSync(
              "git",
              ["show", baseSha + ":apps/mobile/eas.json"],
              { encoding: "utf8" },
            ),
          );
          const current = JSON.parse(
            fs.readFileSync("apps/mobile/eas.json", "utf8"),
          );
          const profileName = process.env.EAS_BUILD_PROFILE;
          const profile = current.build?.[profileName];

          assert.deepEqual(profile, {
            extends: "production",
            environment: "production",
            autoIncrement: true,
            withoutCredentials: true,
            ios: {
              simulator: true,
              buildConfiguration: "Release",
            },
          });
          const withoutCaptureProfile = structuredClone(current);
          delete withoutCaptureProfile.build[profileName];
          assert.deepEqual(withoutCaptureProfile, base);
          NODE

          required_vars=(
            EAS_SIMULATOR_ARTIFACT_SHA256
            EAS_SIMULATOR_BUILD_ID
            EAS_SIMULATOR_BUILD_NUMBER
            EAS_SIMULATOR_BUILD_COMMIT
            EAS_SIMULATOR_BUILD_PROFILE
            EAS_SIMULATOR_BUILD_DISTRIBUTION
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Protected environment variable $name is missing." >&2
              exit 1
            fi
          done

          normalized_sha="$(printf '%s' "$EAS_SIMULATOR_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$normalized_sha" =~ ^[a-f0-9]{64}$ ]]; then
            echo "The supplied artifact SHA-256 is invalid." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            echo "The supplied EAS build ID is invalid." >&2
            exit 1
          fi
          if [[ "$EAS_SIMULATOR_BUILD_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The Simulator build commit does not match github.sha." >&2
            exit 1
          fi
          if [[ "$EAS_SIMULATOR_BUILD_PROFILE" != "$EAS_BUILD_PROFILE" ]]; then
            echo "The Simulator build profile is unexpected." >&2
            exit 1
          fi
          normalized_distribution="$(printf '%s' "$EAS_SIMULATOR_BUILD_DISTRIBUTION" | tr '[:lower:]' '[:upper:]')"
          if [[ "$normalized_distribution" != "SIMULATOR" ]]; then
            echo "The supplied build is not an iOS Simulator build." >&2
            exit 1
          fi
          if [[ ! "$EAS_SIMULATOR_BUILD_NUMBER" =~ ^[0-9]+$ ]] ||
             (( EAS_SIMULATOR_BUILD_NUMBER <= PRODUCTION_BUILD_NUMBER )); then
            echo "The Simulator build number must be distinct from production build 32." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java for Maestro
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Select the pinned Xcode runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Download and verify the EAS Simulator artifact
        shell: bash
        env:
          EAS_SIMULATOR_ARTIFACT_URL: ${{ secrets.EAS_SIMULATOR_ARTIFACT_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${EAS_SIMULATOR_ARTIFACT_URL:-}" ]] ||
             [[ "$EAS_SIMULATOR_ARTIFACT_URL" != https://* ]]; then
            echo "A protected HTTPS EAS artifact URL is required." >&2
            exit 1
          fi

          archive="$RUNNER_TEMP/petflow-ios-simulator-artifact"
          extract_dir="$RUNNER_TEMP/petflow-ios-simulator-app"
          mkdir -p "$extract_dir"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "$EAS_SIMULATOR_ARTIFACT_URL" \
            --output "$archive"

          expected_sha="$(printf '%s' "$EAS_SIMULATOR_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "The EAS artifact SHA-256 does not match the protected value." >&2
            exit 1
          fi

          if unzip -tqq "$archive" >/dev/null 2>&1; then
            ditto -x -k "$archive" "$extract_dir"
          elif tar -tf "$archive" >/dev/null 2>&1; then
            tar -xf "$archive" -C "$extract_dir"
          else
            echo "The verified EAS artifact is not a supported archive." >&2
            exit 1
          fi

          app_paths="$RUNNER_TEMP/petflow-ios-app-paths.txt"
          find "$extract_dir" -type d -name '*.app' -prune -print > "$app_paths"
          app_count="$(wc -l < "$app_paths" | tr -d '[:space:]')"
          if [[ "$app_count" != "1" ]]; then
            echo "Expected exactly one iOS Simulator .app bundle." >&2
            exit 1
          fi
          app_path="$(head -n 1 "$app_paths")"
          info_plist="$app_path/Info.plist"
          if [[ ! -f "$info_plist" ]]; then
            echo "The Simulator app has no Info.plist." >&2
            exit 1
          fi

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          if [[ "$bundle_id" != "$IOS_BUNDLE_ID" ]] ||
             [[ "$app_version" != "$IOS_APP_VERSION" ]] ||
             [[ "$build_number" != "$EAS_SIMULATOR_BUILD_NUMBER" ]]; then
            echo "The Simulator app identity does not match the protected metadata." >&2
            exit 1
          fi
          architectures="$(lipo -archs "$app_path/$executable_name")"
          if [[ " $architectures " != *" arm64 "* ]]; then
            echo "The Simulator app cannot run on the arm64 macOS runner." >&2
            exit 1
          fi

          {
            echo "APP_PATH<<PETFLOW_APP_PATH"
            echo "$app_path"
            echo "PETFLOW_APP_PATH"
          } >> "$GITHUB_ENV"

      - name: Boot an exact-size iPhone Simulator and install PetFlow
        shell: bash
        run: |
          set -euo pipefail

          runtime_id="$(xcrun simctl list runtimes -j | jq -r \
            --arg name "$IOS_RUNTIME_NAME" \
            '.runtimes[] | select(.name == $name and .isAvailable == true) | .identifier' |
            head -n 1)"
          device_type_id="$(xcrun simctl list devicetypes -j | jq -r \
            --arg name "$IOS_DEVICE_NAME" \
            '.devicetypes[] | select(.name == $name) | .identifier' |
            head -n 1)"
          if [[ -z "$runtime_id" ]] || [[ -z "$device_type_id" ]]; then
            echo "The pinned iPhone 16 Plus / iOS 18.5 Simulator is unavailable." >&2
            exit 1
          fi

          simulator_udid="$(xcrun simctl create \
            'PetFlow build 32 capture' "$device_type_id" "$runtime_id")"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          open -a Simulator --args -CurrentDeviceUDID "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl status_bar "$simulator_udid" override \
            --time '9:41' \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl install "$simulator_udid" "$APP_PATH"
          xcrun simctl get_app_container "$simulator_udid" "$IOS_BUNDLE_ID" app >/dev/null

      - name: Install exact mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          maestro_zip="$RUNNER_TEMP/maestro-$MAESTRO_VERSION.zip"
          maestro_dir="$RUNNER_TEMP/maestro-$MAESTRO_VERSION"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip" \
            --output "$maestro_zip"
          actual_maestro_sha="$(shasum -a 256 "$maestro_zip" | awk '{print $1}')"
          if [[ "$actual_maestro_sha" != "$MAESTRO_ZIP_SHA256" ]]; then
            echo "The Maestro archive SHA-256 does not match the pinned release." >&2
            exit 1
          fi
          unzip -q "$maestro_zip" -d "$maestro_dir"
          test -x "$maestro_dir/maestro/bin/maestro"
          echo "MAESTRO_BIN=$maestro_dir/maestro/bin/maestro" >> "$GITHUB_ENV"

      - name: Run the synthetic store-review capture flow
        shell: bash
        env:
          QA_EMAIL: ${{ secrets.PETFLOW_QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.PETFLOW_QA_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${QA_EMAIL:-}" ]] || [[ -z "${QA_PASSWORD:-}" ]]; then
            echo "Protected QA credentials are required." >&2
            exit 1
          fi
          "$MAESTRO_BIN" --no-ansi --device "$SIMULATOR_UDID" \
            test apps/mobile/.maestro/ios/store-capture.yaml \
            --env QA_EMAIL="$QA_EMAIL" \
            --env QA_PASSWORD="$QA_PASSWORD" \
            --test-output-dir="$RUNNER_TEMP/maestro-capture-output"

      - name: Normalize and verify only the five store screenshots
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          raw_dir="$RUNNER_TEMP/petflow-ios-capture-raw"
          output_dir="$RUNNER_TEMP/petflow-ios-capture"
          mkdir -p "$raw_dir" "$output_dir"

          expected_files=(
            01-home-score.png
            02-health-check.png
            03-health-flow.png
            04-account-pets.png
            05-report-summary.png
          )
          for file_name in "${expected_files[@]}"; do
            matches_file="$RUNNER_TEMP/matches-$file_name.txt"
            find "$RUNNER_TEMP/maestro-capture-output" \
              -type f -name "$file_name" -print > "$matches_file"
            match_count="$(wc -l < "$matches_file" | tr -d '[:space:]')"
            if [[ "$match_count" != "1" ]]; then
              echo "Expected one captured $file_name; found $match_count." >&2
              exit 1
            fi
            cp "$(head -n 1 "$matches_file")" "$raw_dir/$file_name"
          done

          CAPTURE_RAW_DIR="$raw_dir" \
          CAPTURE_OUTPUT_DIR="$output_dir" \
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";
          import sharp from "sharp";

          const expectedFiles = [
            "01-home-score.png",
            "02-health-check.png",
            "03-health-flow.png",
            "04-account-pets.png",
            "05-report-summary.png",
          ];
          const rawDir = process.env.CAPTURE_RAW_DIR;
          const outputDir = process.env.CAPTURE_OUTPUT_DIR;
          const hashes = {};

          for (const fileName of expectedFiles) {
            const input = path.join(rawDir, fileName);
            const output = path.join(outputDir, fileName);
            await sharp(input)
              .removeAlpha()
              .png({ compressionLevel: 9 })
              .toFile(output);
            const metadata = await sharp(output).metadata();
            if (
              metadata.width !== 1290 ||
              metadata.height !== 2796 ||
              metadata.hasAlpha !== false ||
              metadata.channels !== 3
            ) {
              throw new Error(
                fileName + " is not an opaque 1290x2796 RGB PNG.",
              );
            }
            hashes[fileName] = crypto
              .createHash("sha256")
              .update(fs.readFileSync(output))
              .digest("hex");
          }

          const runtimeChanges = execFileSync(
            "git",
            [
              "diff",
              "--name-only",
              process.env.RUNTIME_BASE_COMMIT + ".." + process.env.GITHUB_SHA,
            ],
            {
              cwd: process.env.GITHUB_WORKSPACE,
              encoding: "utf8",
            },
          )
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .sort();

          const metadata = {
            source: "github-actions-ios-simulator",
            capturedAt: new Date().toISOString(),
            productionTarget: {
              easBuildId: process.env.PRODUCTION_EAS_BUILD_ID,
              buildNumber: process.env.PRODUCTION_BUILD_NUMBER,
              runtimeCommit: process.env.RUNTIME_BASE_COMMIT,
            },
            simulatorBuild: {
              easBuildId: process.env.EAS_SIMULATOR_BUILD_ID,
              buildNumber: process.env.EAS_SIMULATOR_BUILD_NUMBER,
              commit: process.env.EAS_SIMULATOR_BUILD_COMMIT,
              profile: process.env.EAS_SIMULATOR_BUILD_PROFILE,
              distribution:
                process.env.EAS_SIMULATOR_BUILD_DISTRIBUTION.toUpperCase(),
              artifactSha256:
                process.env.EAS_SIMULATOR_ARTIFACT_SHA256.toLowerCase(),
            },
            device: {
              name: process.env.IOS_DEVICE_NAME,
              runtime: process.env.IOS_RUNTIME_NAME,
              width: 1290,
              height: 2796,
              alpha: false,
            },
            runtimeChanges,
            files: hashes,
          };
          fs.writeFileSync(
            path.join(outputDir, "capture-metadata.json"),
            JSON.stringify(metadata, null, 2) + "\n",
            "utf8",
          );
          NODE

          file_count="$(find "$output_dir" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$file_count" != "6" ]]; then
            echo "The upload directory must contain five PNGs and one metadata file." >&2
            exit 1
          fi

      - name: Upload only screenshots and non-sensitive metadata
        uses: actions/upload-artifact@v4
        with:
          name: petflow-ios-build32-simulator-${{ env.EAS_SIMULATOR_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/petflow-ios-capture/01-home-score.png
            ${{ runner.temp }}/petflow-ios-capture/02-health-check.png
            ${{ runner.temp }}/petflow-ios-capture/03-health-flow.png
            ${{ runner.temp }}/petflow-ios-capture/04-account-pets.png
            ${{ runner.temp }}/petflow-ios-capture/05-report-summary.png
            ${{ runner.temp }}/petflow-ios-capture/capture-metadata.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove the ephemeral Simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi
